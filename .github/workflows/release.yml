name: Release Reference Models

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # The release candidate is gated by the same workflow that gates every PR, called
  # rather than copied. This previously restated a subset of those checks inline and had
  # drifted: validate_pattern_conformance.py and the entire cross-repo-contract job were
  # missing, so a tag could publish a bundle that PR CI would have rejected — including,
  # until v1.17.0, one that no hub could inventory (gh#57).
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      skip-toolkit-pin-check: true

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"
      
      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Version file matches tag: $TAG_VERSION"
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel
        run: |
          uv build --wheel
          # Verify the wheel contains the data directory
          python -m zipfile -l \
                  dist/kairos_ontology_referencemodels-${{ steps.get_version.outputs.version }}-py3-none-any.whl \
            | grep "ontology-reference-models/catalog-v001.xml" \
            || { echo "❌ Wheel missing reference-models data"; exit 1; }

      - name: Create release archive
        run: |
          # The data directory now lives inside the Python package; the tar.gz
          # preserves the original layout for consumers that extract it directly.
          tar -czf kairos-reference-models-${{ steps.get_version.outputs.version }}.tar.gz \
            kairos_ontology_referencemodels/ontology-reference-models/ \
            kairos_ontology_referencemodels/LICENSE \
            kairos_ontology_referencemodels/NOTICE \
            kairos_ontology_referencemodels/__init__.py \
            scripts/ \
            tests/ \
            VERSION \
            CHANGELOG.md \
            README.md \
            pyproject.toml \
            uv.lock \
            LICENSE \
            NOTICE
      
      - name: Generate release notes from CHANGELOG
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Extract section for this version from CHANGELOG.md
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$ d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release, or attach assets to an existing one
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          ASSETS=(
            "kairos-reference-models-$VERSION.tar.gz"
            "dist/kairos_ontology_referencemodels-$VERSION-py3-none-any.whl"
          )
          if gh release view "v$VERSION" --json id >/dev/null 2>&1; then
            # Publishing a release from the GitHub UI creates the tag, and the tag
            # triggers this workflow — so an existing release is the normal outcome
            # of a hand-drafted release, not an error. Keep its hand-written title
            # and notes; attach the built artifacts. --clobber makes a re-run after
            # a partial upload safe. (v1.20.1 shipped asset-less because this case
            # used to fail: "a release with the same tag name already exists".)
            echo "Release v$VERSION already exists — uploading assets to it."
            gh release upload "v$VERSION" --clobber "${ASSETS[@]}"
          else
            gh release create "v$VERSION" \
              --title "Release $VERSION" \
              --notes-file RELEASE_NOTES.md \
              $PRERELEASE_FLAG \
              "${ASSETS[@]}"
          fi
      
      - name: Publish to artifact registry (optional)
        if: false  # Enable when Azure Blob Storage is configured
        run: |
          # Example: Upload to Azure Blob Storage
          # az storage blob upload \
          #   --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
          #   --container-name reference-models \
          #   --name kairos-reference-models-${{ steps.get_version.outputs.version }}.tar.gz \
          #   --file kairos-reference-models-${{ steps.get_version.outputs.version }}.tar.gz
          echo "Artifact registry publishing disabled. Enable when needed."
