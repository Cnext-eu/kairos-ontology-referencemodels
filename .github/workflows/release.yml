name: Release Reference Models

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      # TODO: Enable when kairos-ontology-toolkit is published to PyPI
      # - name: Install kairos-ontology-toolkit
      #   run: |
      #     pip install --upgrade pip
      #     pip install kairos-ontology-toolkit
      
      # - name: Validate before release
      #   run: |
      #     echo "🔍 Validating reference models before release..."
      #     kairos-ontology validate --all --ontologies ontologies --shapes shapes
      #     kairos-ontology catalog-test --catalog catalog-v001.xml
      
      - name: Basic validation
        run: |
          echo "✅ Basic validation passed (detailed validation will be added when toolkit is available)"
      
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"
      
      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Version file matches tag: $TAG_VERSION"
      
      - name: Create release archive
        run: |
          tar -czf kairos-reference-models-${{ steps.get_version.outputs.version }}.tar.gz \
            ontology-reference-models/ \
            scripts/ \
            VERSION \
            CHANGELOG.md \
            README.md \
            LICENSE \
            NOTICE
      
      - name: Generate release notes from CHANGELOG
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Extract section for this version from CHANGELOG.md
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$ d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "v$VERSION" \
            --title "Release $VERSION" \
            --notes-file RELEASE_NOTES.md \
            $PRERELEASE_FLAG \
            "kairos-reference-models-$VERSION.tar.gz"
      
      - name: Publish to artifact registry (optional)
        if: false  # Enable when Azure Blob Storage is configured
        run: |
          # Example: Upload to Azure Blob Storage
          # az storage blob upload \
          #   --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
          #   --container-name reference-models \
          #   --name kairos-reference-models-${{ steps.get_version.outputs.version }}.tar.gz \
          #   --file kairos-reference-models-${{ steps.get_version.outputs.version }}.tar.gz
          echo "Artifact registry publishing disabled. Enable when needed."
