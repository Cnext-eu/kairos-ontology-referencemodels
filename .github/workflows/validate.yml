name: Validate Reference Models

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      # TODO: Enable when kairos-ontology-toolkit is published to PyPI
      # - name: Install kairos-ontology-toolkit
      #   run: |
      #     pip install --upgrade pip
      #     pip install kairos-ontology-toolkit
      
      # - name: Display toolkit version
      #   run: kairos-ontology --version
      
      # - name: Validate ontology syntax and SHACL
      #   run: |
      #     kairos-ontology validate \
      #       --ontologies ontologies \
      #       --shapes shapes \
      #       --all
      
      # - name: Test XML catalog resolution
      #   run: |
      #     kairos-ontology catalog-test --catalog catalog-v001.xml
      
      # - name: Generate test projections
      #   run: |
      #     kairos-ontology project \
      #       --target all \
      #       --ontologies ontologies \
      #       --mappings mappings \
      #       --output test-output
      
      - name: Install validation dependencies
        run: pip install --quiet pytest jsonschema pyyaml rdflib

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Logistics Blueprint
        run: |
          python scripts/generate_logistics_inventory.py --check
          python scripts/validate_logistics_blueprint.py

      - name: Check generated pack documentation is current
        run: python scripts/generate_pack_docs.py --check
      
      - name: Validate repository structure
        run: |
          python scripts/validate_structure.py
      
      - name: Check per-ontology versions
        run: |
          python scripts/version_manager.py check

      - name: Validate archetype blueprints
        run: python scripts/validate_archetypes.py

      - name: Validate pattern conformance (derived ontologies vs pattern library)
        run: python scripts/validate_pattern_conformance.py

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            validation-report.json
            validation-report-skos.json
            test-output/
          retention-days: 30
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Validation failed. Please check the validation report artifacts for details.'
            })

  # Separate job on purpose: the structural validation above stays toolkit-free, so this
  # repo never build-depends on its own consumer. Only the cross-repo contract needs the
  # toolkit installed, and only that job pays the cost of fetching it.
  cross-repo-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check the toolkit pin is current for its channel
        run: uv run --extra dev python scripts/check_toolkit_pin.py --check

      - name: Install the pinned toolkit
        run: uv sync --extra dev

      # test_toolkit_contract.py probes for the toolkit's loaders and SKIPS when absent,
      # which is why it never ran in CI before. Point it at the installed package and
      # assert it actually collected tests, so a silent skip fails the build instead of
      # passing it — the exact failure mode this job exists to end.
      - name: Run cross-repo contract tests against the installed toolkit
        run: |
          export KAIROS_TOOLKIT_SRC="$(uv run python -c 'import kairos_ontology, pathlib; print(pathlib.Path(kairos_ontology.__file__).parent.parent)')"
          echo "KAIROS_TOOLKIT_SRC=$KAIROS_TOOLKIT_SRC"
          uv run --extra dev python -m pytest tests/test_toolkit_contract.py -v -ra \
            -p no:randomly --strict-markers | tee contract.log
          if grep -qE '^[0-9]+ skipped|no tests ran' contract.log; then
            echo "::error::Contract tests skipped instead of running — the toolkit was not visible."
            exit 1
          fi
