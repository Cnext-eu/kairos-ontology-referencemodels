name: Validate Reference Models

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

  # Called by release.yml so a tag is gated by exactly these checks. Until v1.17.0 the
  # release workflow restated a subset of them by hand and had already drifted: it was
  # missing validate_pattern_conformance.py and the whole cross-repo-contract job, so a
  # release could publish content that PR CI would have rejected. Reuse, not restatement
  # — the two gates cannot diverge if there is only one of them.
  workflow_call:
    inputs:
      skip-toolkit-pin-check:
        description: >
          Skip the "is the pin current for its channel" check. Releases pass true: that
          check compares against whatever the toolkit has published since, so it is
          time-dependent and would block a release for a reason that has nothing to do
          with the artifact being released. What a release does still need — that the
          pinned toolkit can actually read this bundle — is the contract and conformance
          suites, which run either way.

          Phrased as skip-rather-than-require on purpose: on push/PR the `inputs` context
          is null, and GitHub coerces null and false alike to 0, so a `!= false` guard
          would silently skip the check on ordinary CI. `!null` is true, so this form
          fails safe.
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      # Toolkit-driven checks deliberately do NOT live here — see the cross-repo-contract
      # job below, which installs the pinned toolkit via `uv sync` and runs the contract
      # and bundle-conformance suites against it. This job stays toolkit-free on purpose.

      - name: Install validation dependencies
        run: pip install --quiet pytest jsonschema pyyaml rdflib

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Logistics Blueprint
        run: |
          python scripts/generate_logistics_inventory.py --check
          python scripts/validate_logistics_blueprint.py

      - name: Check generated pack documentation is current
        run: python scripts/generate_pack_docs.py --check
      
      - name: Validate repository structure
        run: |
          python scripts/validate_structure.py
      
      - name: Check per-ontology versions
        run: |
          python scripts/version_manager.py check

      - name: Validate archetype blueprints
        run: python scripts/validate_archetypes.py

      - name: Validate pattern conformance (derived ontologies vs pattern library)
        run: python scripts/validate_pattern_conformance.py

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            validation-report.json
            validation-report-skos.json
            test-output/
          retention-days: 30
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Validation failed. Please check the validation report artifacts for details.'
            })

  # Separate job on purpose: the structural validation above stays toolkit-free, so this
  # repo never build-depends on its own consumer. Only the cross-repo contract needs the
  # toolkit installed, and only that job pays the cost of fetching it.
  cross-repo-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Skipped for releases only — see skip-toolkit-pin-check above.
      - name: Check the toolkit pin is current for its channel
        if: ${{ !inputs.skip-toolkit-pin-check }}
        run: uv run --extra dev python scripts/check_toolkit_pin.py --check

      - name: Install the pinned toolkit
        run: uv sync --extra dev

      # Both suites probe for the toolkit's loaders and SKIP when absent, which is why
      # test_toolkit_contract.py never ran in CI before. Point them at the installed
      # package and assert they actually collected tests, so a silent skip fails the
      # build instead of passing it — the exact failure mode this job exists to end.
      #
      # test_toolkit_contract.py covers the published surfaces (patterns, archetypes).
      # test_bundle_conformance.py covers the corpus: it runs the toolkit's inventory
      # and closure APIs over every bundled TTL. v1.16.0 released with three unresolvable
      # closures and an inventory filename collision because nothing did that (gh#57).
      - name: Run cross-repo contract and bundle conformance tests against the installed toolkit
        run: |
          export KAIROS_TOOLKIT_SRC="$(uv run python -c 'import kairos_ontology, pathlib; print(pathlib.Path(kairos_ontology.__file__).parent.parent)')"
          echo "KAIROS_TOOLKIT_SRC=$KAIROS_TOOLKIT_SRC"
          uv run --extra dev python -m pytest \
            tests/test_toolkit_contract.py tests/test_bundle_conformance.py -v -ra \
            -p no:randomly --strict-markers | tee contract.log
          if grep -qE '^[0-9]+ skipped|no tests ran' contract.log; then
            echo "::error::Contract tests skipped instead of running — the toolkit was not visible."
            exit 1
          fi
