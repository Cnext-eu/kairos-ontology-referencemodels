name: User Story
description: Describe a feature or requirement from an end-user perspective
title: "[User Story] "
labels:
  - "type: feature"
  - "priority: p2"
body:
  - type: markdown
    attributes:
      value: |
        ## User Story
        Use this template to describe **what the user needs and why**.
        Keep it small enough to be completed within a sprint.

  - type: textarea
    id: story
    attributes:
      label: User Story
      description: Define the user, need, and value
      placeholder: |
        As a **[role]**,
        I want **[feature or capability]**
        so that **[benefit or value]**.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Conditions that must be met for this story to be considered done
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary Area
      description: Select the main area impacted by this user story
      options:
        - core
        - model
        - training
        - inference
        - evaluation
        - data
        - api
        - performance
        - infra
        - docs
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Estimated Size
      description: Rough effort estimate for planning
      options:
        - xs
        - s
        - m
        - l
        - xl
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any extra details, screenshots, links, or related issues
      placeholder: |
        - Related epic: #123
        - Design doc: link
        - Screenshots / examples
    validations:
      required: false
