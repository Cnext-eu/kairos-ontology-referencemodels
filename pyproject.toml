[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kairos-ontology-referencemodels"
dynamic = ["version"]
description = "Kairos ontology reference models — distributable data package (FIBO, IATA ONE Record, blueprints, archetypes, patterns)"
requires-python = ">=3.12"
# Data-only package: no runtime dependencies on the toolkit.
dependencies = []

[project.optional-dependencies]
dev = [
    "kairos-ontology-toolkit @ https://github.com/Cnext-eu/kairos-ontology-toolkit/releases/download/v5.9.0/kairos_ontology_toolkit-5.9.0-py3-none-any.whl",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    # CI passes `-p no:randomly`; today the plugin only arrives transitively via the
    # toolkit wheel, so a toolkit-free dev install would fail on the unknown option.
    "pytest-randomly>=3.16",
    "rdflib>=7.4",
]

[tool.hatch.version]
# The VERSION file is already tag-matched in the release workflow.
path = "VERSION"
pattern = "(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"

[tool.hatch.build.targets.wheel]
# Only the Python package directory is shipped in the wheel.
# scripts/ and tests/ stay at repo root (dev-only, not shipped).
packages = ["kairos_ontology_referencemodels"]

[tool.hatch.metadata]
# The [dev] extras pin the toolkit via a direct GitHub Release URL.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]

[tool.kairos]
# Channel controls which toolkit version is installed on `kairos-ontology update --upgrade`.
#   "stable"  — latest GA release (default)
#   "preview" — latest pre-release (rc/beta/alpha) for testing new features
#   "v2.16.0" — explicit pinned version
channel = "preview"
