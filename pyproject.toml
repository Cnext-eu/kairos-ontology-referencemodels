[project]
name = "kairos-ontology-referencemodels"
# Never-published virtual package version — uv.lock mirrors it as `virtual = "."`.
# The repository version consumers see lives in the root VERSION file (SemVer, tag-matched).
version = "0.1.0"
description = "Kairos ontology hub — kairos-ontology-referencemodels"
requires-python = ">=3.12"
dependencies = [
    "kairos-ontology-toolkit @ https://github.com/Cnext-eu/kairos-ontology-toolkit/releases/download/v5.2.3rc1/kairos_ontology_toolkit-5.2.3rc1-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    # CI passes `-p no:randomly`; today the plugin only arrives transitively via the
    # toolkit wheel, so a toolkit-free dev install would fail on the unknown option.
    "pytest-randomly>=3.16",
    "rdflib>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]

[tool.kairos]
# Channel controls which toolkit version is installed on `kairos-ontology update --upgrade`.
#   "stable"  — latest GA release (default)
#   "preview" — latest pre-release (rc/beta/alpha) for testing new features
#   "v2.16.0" — explicit pinned version
channel = "preview"
