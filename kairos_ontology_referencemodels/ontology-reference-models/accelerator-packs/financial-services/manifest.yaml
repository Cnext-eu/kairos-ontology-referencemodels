package:
  id: financial-services
  name: "Kairos Financial Services Accelerator Pack"
  version: "2.1.0"
  description: "Pre-composed ontology bundle for financial services companies"
  namespace: "https://www.kairosflow.ai/ont/accelerator/financial-services#"
  
  target_sectors:
    - Accounting firms
    - Banks and credit institutions
    - Auditors
    - Financial services providers
    - Insurance companies
    - Trade finance institutions

  includes:
    - id: FIBO-FND
      name: "FIBO Foundations"
      uri: "https://spec.edmcouncil.org/fibo/ontology/FND/"
      focus: "Agents, parties, organisations, agreements, contracts, dates, places, accounting, transactions"
    - id: FIBO-BE
      name: "FIBO Business Entities"
      uri: "https://spec.edmcouncil.org/fibo/ontology/BE/"
      focus: "Legal entities, corporate structure, ownership, partnerships, trusts, government entities"
    - id: FIBO-FBC
      name: "FIBO Financial Business and Commerce"
      uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/"
      focus: "Financial instruments, intermediaries, registries, products and services"
    - id: FIBO-SEC
      name: "FIBO Securities"
      uri: "https://spec.edmcouncil.org/fibo/ontology/SEC/"
      focus: "Debt, equities, funds, issuance, classification, listings"
    - id: FIBO-DER
      name: "FIBO Derivatives"
      uri: "https://spec.edmcouncil.org/fibo/ontology/DER/"
      focus: "Options, futures, forwards, swaps, credit/rate/security-based derivatives"
    - id: FIBO-LOAN
      name: "FIBO Loans"
      uri: "https://spec.edmcouncil.org/fibo/ontology/LOAN/"
      focus: "Commercial, consumer, student, mortgage, green loans"
    - id: FIBO-IND
      name: "FIBO Indicators and Indices"
      uri: "https://spec.edmcouncil.org/fibo/ontology/IND/"
      focus: "Economic indicators, FX, interest rates, market indices"
    - id: FIBO-MD
      name: "FIBO Market Data"
      uri: "https://spec.edmcouncil.org/fibo/ontology/MD/"
      focus: "Prices, yields, analytics, temporal market data"
    - id: FIBO-CAE
      name: "FIBO Corporate Actions and Events"
      uri: "https://spec.edmcouncil.org/fibo/ontology/CAE/"
      focus: "Corporate actions: splits, dividends, offerings, events"
    - id: FIBO-BP
      name: "FIBO Business Process"
      uri: "https://spec.edmcouncil.org/fibo/ontology/BP/"
      focus: "Securities issuance, transaction workflows"
    - id: FIBO-ACTUS
      name: "ACTUS Contract Analytics"
      uri: "https://spec.edmcouncil.org/fibo/ontology/ACTUS/"
      focus: "Algorithmic contract terms, cashflow taxonomy"

  excludes:
    - id: DCSA
      reason: "Use Logistics Accelerator for container shipping ontologies"
    - id: MMT
      reason: "Use Logistics Accelerator for multi-modal transport ontologies"
    - id: TIC
      reason: "Use Logistics Accelerator for terminal operations ontologies"
    - id: IMO
      reason: "Use Logistics Accelerator for maritime regulatory ontologies"
    - id: WCO
      reason: "Use Logistics Accelerator for customs ontologies"
    - id: BSP
      reason: "Use Logistics Accelerator for buy-ship-pay ontologies"
    - id: Sustainability
      reason: "Use Logistics Accelerator for sustainability ontologies"

  standards_alignment:
    - "FIBO (EDM Council)"
    - "ACTUS (Algorithmic Contract Types Unified Standards)"
