  # ─── 19. Financial settlement, revenue/yield & cost allocation ─────────
  # DECLARED GAP: trade lane / market segment has no class in the commercial
  # ontology (capability-coverage.yaml id: `trade-lane-and-market-segment`).
  # `bsp/revenue-yield#ProfitabilityScope` is the closest real class — it
  # names *that* a profitability boundary exists but not the specific
  # trade-lane / segment dimension this sector reports against. The
  # discovery doc covers trade-lane profitability reporting in prose; do not
  # invent a "TradeLane" class here. CostAllocation / AllocationBasis are the
  # anchors for the own-vs-subcontracted allocation grain flagged in
