  # ─── 21. Crew, drivers and accompanied passengers ──────────────────────
  # Accompanied traffic is constitutive of this archetype, and the accompanying
  # driver is neither cargo nor crew: on a ro-ro sailing they are carried on the
  # passenger manifest. That manifest is a legal obligation (SOLAS/EU passenger
  # registration) and the reason the driver has to be a modelled party at all.
  # There is no dedicated "accompanying driver" class and none should be invented -
  # the driver is a Passenger on the sailing and a role assignment on the leg.
  - { uri: "https://www.kairosflow.ai/ont/imo/crew-seafarer#Passenger",           tier: recommended, label: "Passenger (accompanying driver on the ferry leg)" }
