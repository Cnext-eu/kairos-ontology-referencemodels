schema_version: 1
id: unit-load-carrier
label: "Unit-load / ro-ro / short-sea carrier (non-containerised)"
description: >
  Companies that move non-containerised unit loads — trailers, swap bodies, and
  cassettes — rather than ISO containers, typically across a ro-ro / short-sea
  ferry leg bookended by road haulage. Both accompanied traffic (the driver
  travels with the trailer, e.g. an unaccompanied-crossing ferry) and
  unaccompanied traffic (the trailer crosses without its driver) occur on the
  same network. The operator runs own-account road haulage alongside
  subcontracted hauliers, and that own-vs-subcontracted split is itself a
  first-order modelling concern for this archetype — it is largely absent from
  the `shipping-carrier` and `freight-forwarder` archetypes. Ro-ro / short-sea
  vessel capacity is measured in lane metres, not TEU, and the operator manages
  a trailer/swap-body/cassette equipment fleet that requires empty
  repositioning across its network. The archetype covers trade-lane
  profitability reporting, dangerous goods carried on trailers, and short-sea
  border/customs formalities (e.g. the post-Brexit UK-EU customs burden that
  drives much of this sector's data model, referenced here generically without
  naming a specific carrier). Two capability gaps are intentionally NOT
  papered over with invented classes — see the "declared gap" comments below
  and `accelerator-packs/logistics/current/blueprint/capability-coverage.yaml`
  (ids `empty-equipment-repositioning`, `trade-lane-and-market-segment`).

compatible_with:
  repo_tag_range: ">=1.13.0,<2.0.0"
  ontology_versions:
    DCSA:           ">=1.3.0,<2"
    # MMT 2.0.0: temporal-quartet property renames (clean break) + role-assignment machinery.
    MMT:            ">=2.0.0,<3"
    # BSP 2.0.0: estimatedDeliveryDate rename (clean break) + party-prop re-ranging to TradeParty.
    BSP:            ">=2.0.0,<3"
    TIC:            ">=1.3.0,<2"
    IMO:            ">=1.1.0,<2"
    WCO:            ">=1.2.0,<2"
    Sustainability: ">=1.1.0,<2"

# ─── Ref-model modules ─────────────────────────────────────────────────────────
# Tier reflects whether the *module* is expected to be touched by a typical
# unit-load / ro-ro / short-sea carrier's data model. Specific class-level
# expectations are in core_concepts.
ref_model_modules:
  # Commercial cycle (booking → transport document). CMR/road waybill is the
  # primary transport document for this archetype, not an ocean B/L.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/booking",             tier: required }
  - { iri: "https://www.kairosflow.ai/ont/blueprint/transport-order", tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/mmt/documents",            tier: required }
  - { iri: "https://www.kairosflow.ai/ont/mmt/consignment",          tier: required }
  - { iri: "https://www.kairosflow.ai/ont/mmt/cargo",                tier: required }

  # Parties & roles — mode-neutral MMT party module, not the ocean-specific
  # DCSA party module, because own-account vs subcontracted haulier and
  # inland-carrier roles are first-class here.
  - { iri: "https://www.kairosflow.ai/ont/mmt/party",                tier: required }

  # Locations & geographic network — ro-ro terminal, border crossing, depot.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/locations",           tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/mmt/locations",            tier: required }

  # Transport calls — truck call is a first-class citizen for this archetype.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/transport-call",      tier: required }

  # Vessels / ferry and the short-sea leg's schedule.
  - { iri: "https://www.kairosflow.ai/ont/mmt/transport-means",      tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/imo/vessel-registry",      tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/schedule",            tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/imo/port-call",            tier: recommended }

  # Road / inland leg and haulage — own-account vs subcontracted, accompanied
  # vs unaccompanied handover.
  - { iri: "https://www.kairosflow.ai/ont/mmt/inland-transport",     tier: required }

  # Equipment fleet — non-containerised. Deliberately anchored on the general
  # multimodal equipment module, not the DCSA container-family module (see
  # §10 comment in core_concepts).
  - { iri: "https://www.kairosflow.ai/ont/mmt/equipment",            tier: required }

  # Terminal / ro-ro handling (roll-on/roll-off is a horizontal move, not a
  # lift, which is why the TIC handling-operations module is in scope here
  # in a way it typically isn't for a container-terminal-only archetype).
  - { iri: "https://www.kairosflow.ai/ont/tic/terminal-infrastructure", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/tic/handling-operations",     tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/tic/locations",                tier: optional }

  # Track and trace.
  - { iri: "https://www.kairosflow.ai/ont/mmt/events",               tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/events",              tier: recommended }

  # Detention and equivalent delay charges — reused from the DCSA module;
  # this archetype's centre of gravity is equipment detention, not cargo
  # demurrage (see §14 comment in core_concepts).
  - { iri: "https://www.kairosflow.ai/ont/dcsa/demurrage-detention", tier: recommended }

  # Dangerous goods carried on trailers.
  - { iri: "https://www.kairosflow.ai/ont/mmt",                      tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/imo/dangerous-goods",      tier: recommended }

  # Customs and trade facilitation — real exposure at short-sea borders.
  - { iri: "https://www.kairosflow.ai/ont/wco/customs",              tier: required }
  - { iri: "https://www.kairosflow.ai/ont/wco/trade-facilitation",   tier: optional }

  # Sustainability — tonne-km, modal-shift, fuel/energy for the road fleet
  # and the ferry leg.
  - { iri: "https://www.kairosflow.ai/ont/sustainability/carbon",    tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/sustainability/energy",    tier: optional }

  # Financial settlement, revenue/yield, and cost allocation — trade-lane
  # profitability and own-vs-subcontracted cost allocation live here.
  - { iri: "https://www.kairosflow.ai/ont/bsp/financial",            tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/bsp/revenue-yield",        tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/bsp/cost-accounting",      tier: optional }

# ─── Core concepts ─────────────────────────────────────────────────────────────
# Grouped by business area. Tiers:
#   required    — every unit-load / ro-ro / short-sea carrier is expected to
#                 model this
#   recommended — most carriers have it; sub-flavours may legitimately omit
#   optional    — present only when the carrier is in scope for that
#                 regulation / sub-flavour / capability
core_concepts:

  # ─── 1. Booking / order intake ─────────────────────────────────────────
  # Demand-side order, recommended not required: this archetype is supply side for its own
  # tonnage, and only needs the order grain where it sells door-to-door direct and subcontracts
  # legs it does not run itself. See patterns/multimodal-order-leg "When NOT to use".
  - { uri: "https://www.kairosflow.ai/ont/blueprint/transport-order#TransportOrder", tier: recommended, label: "Transport Order" }
  - { uri: "https://www.kairosflow.ai/ont/blueprint/transport-order#CarrierReservation", tier: recommended, label: "Carrier Reservation" }

  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#Booking",                tier: required,    label: "Booking" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#BookingRequest",         tier: required,    label: "Booking Request" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#ConfirmedBooking",       tier: required,    label: "Confirmed Booking" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#Shipment",               tier: required,    label: "Shipment" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#ShippingInstruction",    tier: recommended, label: "Shipping Instruction" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#CargoItem",              tier: required,    label: "Cargo Item" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#Commodity",              tier: recommended, label: "Commodity" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#RequestedEquipment",     tier: required,    label: "Requested Equipment" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#UtilizedTransportEquipment", tier: required, label: "Utilized Transport Equipment" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#TransportPlanLeg",       tier: recommended, label: "Transport Plan Leg" }

  # ─── 2. Transport document (CMR / road waybill, not ocean B/L) ────────
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#TransportDocument",      tier: required,    label: "Transport Document" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#RoadConsignmentNote",    tier: required,    label: "Road Consignment Note (CMR)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#RailConsignmentNote",    tier: optional,    label: "Rail Consignment Note (CIM)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#TransportInstructions",  tier: recommended, label: "Transport Instructions" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#DeliveryInstructions",   tier: recommended, label: "Delivery Instructions" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#CargoManifest",          tier: recommended, label: "Cargo Manifest" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#DangerousGoodsDeclaration", tier: recommended, label: "Dangerous Goods Declaration" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#CustomsDeclaration",     tier: recommended, label: "Customs Declaration (MMT)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#CertificateOfOrigin",    tier: optional,    label: "Certificate of Origin" }

  # ─── 3. Consignment & movement ─────────────────────────────────────────
  # TransportMovement is also the natural home for the "physical trip" grain
  # (distance, toll, emissions, predecessor/successor chaining) referenced by
  # CR-RM-07 §9.3 as a third shipment grain beyond carrier-transaction and
  # goods-collection.
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment",          tier: required,    label: "Consignment" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#ConsignmentItem",      tier: required,    label: "Consignment Item" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#GoodsItem",            tier: required,    label: "Goods Item" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportLeg",         tier: required,    label: "Transport Leg" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportRoute",       tier: recommended, label: "Transport Route" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportService",     tier: recommended, label: "Transport Service" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportServiceExecution", tier: optional, label: "Transport Service Execution" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportMovement",    tier: recommended, label: "Transport Movement (physical trip grain)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#MasterConsignment",    tier: optional,    label: "Master Consignment" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#HouseConsignment",     tier: optional,    label: "House Consignment" }

  # ─── 4. Cargo characteristics ──────────────────────────────────────────
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#Goods",                      tier: required,    label: "Goods" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#PackageSpecification",       tier: recommended, label: "Package Specification" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#Weight",                     tier: required,    label: "Weight" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#Dimension",                  tier: recommended, label: "Dimension" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#CargoMeasurement",           tier: recommended, label: "Cargo Measurement" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#HandlingInstructions",       tier: recommended, label: "Handling Instructions" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#ShippingMarks",              tier: optional,    label: "Shipping Marks" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#CargoInsurance",             tier: optional,    label: "Cargo Insurance" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#QuarantineInstructions",     tier: optional,    label: "Quarantine Instructions" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#DisposalInstructions",       tier: optional,    label: "Disposal Instructions" }

  # ─── 5. Parties & roles ────────────────────────────────────────────────
  # Roles are modelled via the qualified-role-assignment machinery (MMT 2.0.0):
  # one durable TransportParty, 0..n role assignments, each scoped to a context.
  # Own-account vs subcontracted haulier is NOT modelled as two subclasses —
  # both are the same real class (Carrier / InlandCarrier, §9 below) with the
  # own-vs-subcontracted split carried as a qualified-role distinction. The
  # per-role subclasses below are deprecated standards overlays: recommended
  # for message-level interop, never the hub's role model.
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#TransportParty",             tier: required,    label: "Transport Party (abstract identity)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#TransportPartyRoleAssignment", tier: required,  label: "Transport Party Role Assignment" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#TransportPartyRoleCode",     tier: required,    label: "Transport Party Role Code (governed list)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#Carrier",                    tier: recommended, label: "Carrier (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#Consignor",                  tier: recommended, label: "Consignor (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#Consignee",                  tier: recommended, label: "Consignee (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#FreightForwarder",           tier: recommended, label: "Freight Forwarder (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#NotifyParty",                tier: optional,    label: "Notify Party (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#CustomsBroker",              tier: recommended, label: "Customs Broker (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#TerminalOperator",           tier: recommended, label: "Terminal Operator (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#WarehouseOperator",          tier: optional,    label: "Warehouse Operator (deprecated role overlay)" }

  # ─── 6. Locations & geographic network ─────────────────────────────────
  - { uri: "https://www.kairosflow.ai/ont/dcsa/locations#Port",                  tier: required,    label: "Port (ro-ro / ferry terminal)" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/locations#Terminal",              tier: required,    label: "Terminal" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/locations#BorderCrossing",        tier: required,    label: "Border Crossing" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/locations#Depot",                 tier: recommended, label: "Depot" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/locations#Location",               tier: required,    label: "Location" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/locations#TransportLocation",      tier: required,    label: "Transport Location" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/locations#RoadTerminal",           tier: required,    label: "Road Terminal" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/locations#Warehouse",              tier: optional,    label: "Warehouse" }

  # ─── 7. Transport calls ────────────────────────────────────────────────
  - { uri: "https://www.kairosflow.ai/ont/dcsa/transport-call#TransportCall",        tier: required,    label: "Transport Call" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/transport-call#TruckTransportCall",   tier: required,    label: "Truck Transport Call" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/transport-call#VesselTransportCall",  tier: required,    label: "Vessel Transport Call (ferry)" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/transport-call#RailTransportCall",    tier: optional,    label: "Rail Transport Call" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/transport-call#BargeTransportCall",   tier: optional,    label: "Barge Transport Call" }

  # ─── 8. Vessel / ferry operation (short-sea ro-ro leg) ─────────────────
  # DECLARED GAP: lane-metre capacity has no dedicated class anywhere in this
  # pack's ontologies. `imo/vessel-registry#VesselCapacity` is the closest
  # real class and is used below, but it is a generic capacity holder with no
  # lane-metre-specific structure — the discovery doc covers the lane-metre
  # measurement model in prose instead of a fabricated
  # "LaneMetreCapacity" class.
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#Vessel",           tier: recommended, label: "Vessel (MMT, ferry)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#RoadVehicle",      tier: required,    label: "Road Vehicle (tractor unit)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#LogisticsConvoy",  tier: recommended, label: "Logistics Convoy (trailers grouped on one ferry crossing)" }
  - { uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#Vessel",          tier: recommended, label: "Vessel (IMO registry)" }
  - { uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#VesselType",      tier: recommended, label: "Vessel Type" }
  - { uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#VesselCapacity",  tier: recommended, label: "Vessel Capacity (generic — see lane-metre gap note above)" }
  - { uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#Fleet",           tier: recommended, label: "Fleet" }
  - { uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#FlagState",       tier: optional,    label: "Flag State" }
  - { uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#VesselOperationalStatus", tier: recommended, label: "Vessel Operational Status" }
  - { uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#IMONumber",       tier: optional,    label: "IMO Number" }
  - { uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#MMSI",            tier: optional,    label: "MMSI" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/schedule#SailingSchedule",       tier: recommended, label: "Sailing Schedule (frequent fixed ferry departures)" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/schedule#CutOffTime",           tier: recommended, label: "Cut-off Time" }
  - { uri: "https://www.kairosflow.ai/ont/imo/port-call#PortCall",              tier: recommended, label: "Port Call" }
  - { uri: "https://www.kairosflow.ai/ont/imo/port-call#BerthStay",             tier: optional,    label: "Berth Stay" }
  - { uri: "https://www.kairosflow.ai/ont/imo/port-call#SeaLeg",                tier: recommended, label: "Sea Leg (the ferry crossing itself)" }

  # ─── 9. Road / inland leg & haulage (own-account vs subcontracted) ─────
  # InlandCarrier is the anchor for BOTH own-account and subcontracted
  # haulage; the distinction is attribute-level (see §5 comment). No class
  # gap here — the pack already models this leg via mmt/inland-transport.
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#InlandCarrier",   tier: required,    label: "Inland Carrier (own-account or subcontracted haulier)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#RoadLeg",         tier: required,    label: "Road Leg" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#InlandLeg",       tier: recommended, label: "Inland Leg" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#InlandTerminal",  tier: recommended, label: "Inland Terminal" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#HaulageInstructions", tier: required, label: "Haulage Instructions" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#HandoverEvent",   tier: required,    label: "Handover Event (driver/trailer handover — accompanied vs unaccompanied)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#RailLeg",         tier: optional,    label: "Rail Leg" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#BargeLeg",        tier: optional,    label: "Barge Leg" }

  # ─── 10. Equipment fleet (non-containerised) ───────────────────────────
  # Anchor is `mmt/equipment#TransportEquipment`, NOT `dcsa/equipment#Container`
  # — per CR-RM-07 §9.2's correction to the equipment-asset canonical anchor,
  # this archetype's primary units are trailers, swap bodies, and cassettes,
  # which cannot be modelled on a container-shaped anchor (ISO 6346 identity,
  # TEU capacity). Container/reefer/tank equipment stays present at optional
  # tier only, for carriers whose fleet is genuinely mixed.
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#TransportEquipment",     tier: required,    label: "Transport Equipment (fleet anchor)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#TrailerUnit",           tier: required,    label: "Trailer Unit" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#SwapBody",              tier: required,    label: "Swap Body" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#Pallet",                tier: optional,    label: "Pallet" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#Seal",                  tier: recommended, label: "Seal" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#TemperatureSettingInstructions", tier: optional, label: "Temperature Setting Instructions (reefer trailer)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#FreightContainer",      tier: optional,    label: "Freight Container (mixed-fleet operators only)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#ReeferContainer",       tier: optional,    label: "Reefer Container (mixed-fleet operators only)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#TankContainer",         tier: optional,    label: "Tank Container (mixed-fleet operators only)" }

  # ─── 11. Empty equipment availability & repositioning (DECLARED GAP) ───
  # No parent class for "empty equipment availability / repositioning" exists
  # anywhere in this pack's ontologies (capability-coverage.yaml id:
  # `empty-equipment-repositioning`; confirmed also absent for
  # shipping-carrier's container fleet). `mmt/events#TransferEvent` is the
  # closest real class — a repositioning move is, structurally, a transfer of
  # an equipment unit between two locations with no revenue cargo attached —
  # but it carries none of the network-optimisation or availability-forecast
  # semantics this sector needs. The discovery doc covers this gap in prose;
  # do not invent a "TrailerAllocation" or "EmptyEquipmentPool" class here.
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#TransferEvent",            tier: recommended, label: "Transfer Event (closest proxy for an empty reposition move — see gap note above)" }

  # ─── 12. Terminal / ro-ro handling ──────────────────────────────────────
  # Roll-on/roll-off is a horizontal move (the unit is driven or towed on and
  # off), not a lift — HorizontalMove is the structurally correct TIC class
  # for this, in contrast to a container terminal's LiftOnLiftOff.
