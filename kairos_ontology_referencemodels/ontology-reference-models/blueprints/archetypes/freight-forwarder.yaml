schema_version: 1
id: freight-forwarder
label: "Freight forwarder / multimodal logistics service provider"
description: >
  Companies that arrange transport across one or more carriers and modes on behalf of
  shippers, commonly consolidating house consignments into master consignments and
  issuing or managing transport documents. Typical scope includes quotation and booking,
  party coordination, pickup and delivery planning, cargo and equipment handling,
  milestone visibility, customs coordination, and exception management. The archetype
  does not assume that the forwarder owns transport equipment, terminals, or vessels.

compatible_with:
  repo_tag_range: ">=1.11.0,<2.0.0"
  ontology_versions:
    # BSP 2.0.0: estimatedDeliveryDate rename (clean break) + party-prop re-ranging to TradeParty.
    BSP: ">=2.0.0,<3"
    DCSA: ">=1.3.0,<2"
    # MMT 2.0.0: temporal-quartet property renames (clean break) + role-assignment machinery.
    MMT: ">=2.0.0,<3"
    WCO: ">=1.2.0,<2"
    IMO: ">=1.3.0,<2"
    RAIL: ">=1.1.0,<2"
    Sustainability: ">=1.2.0,<2"

ref_model_modules:
  - { iri: "https://www.kairosflow.ai/ont/bsp/party", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/blueprint/transport-order", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/booking", tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/mmt/party", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/mmt/consignment", tier: required }
  # Mode lives on the leg, never on the order — patterns/multimodal-order-leg. Without this
  # module a forwarder hub cannot state that a leg is a road, rail or barge leg at all.
  - { iri: "https://www.kairosflow.ai/ont/mmt/inland-transport", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/mmt/transport-means", tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/mmt/documents", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/mmt/cargo", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/mmt/equipment", tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/mmt/locations", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/events", tier: recommended }
  # Mode-neutral events. `dcsa/events` above is ocean-shaped (vessel departure, gate
  # in/out); a forwarder's road and rail legs need pickup, delivery and transfer too.
  - { iri: "https://www.kairosflow.ai/ont/mmt/events", tier: recommended }
  # Lodging declarations is the normal case for a customs-capable forwarder, not an
  # edge case — the `customs-role` axis demotes it back for a track-only operation.
  - { iri: "https://www.kairosflow.ai/ont/wco/customs", tier: recommended }

  # Charges, invoicing and margin. `bsp/financial` is required, not optional: a
  # forwarder buys and resells transport, so cost-and-sell per shipment is its core
  # commercial fact — more central than for either sibling archetype. `Charge`,
  # `Invoice` and `BillingDocumentLine` are the anchors a real forwarder charge and
  # AR/AP table set lands on (gh#104).
  - { iri: "https://www.kairosflow.ai/ont/bsp/financial", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/bsp/cost-accounting", tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/bsp/revenue-yield", tier: recommended }
  # Quote → order. §3 of the discovery guide has always asked about quoting; until now
  # no class existed for the answer to land on.
  - { iri: "https://www.kairosflow.ai/ont/bsp/commercial", tier: recommended }
  # Delay charges the forwarder receives from a carrier and passes on to its customer.
  # Reused from DCSA rather than modelled again — same module `unit-load-carrier` uses.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/demurrage-detention", tier: recommended }

  # Itinerary locations and calls. Place of receipt / port of loading / port of
  # discharge / place of delivery are the forwarder's routing skeleton; `mmt/locations`
  # above carries the durable location, these carry its role in an itinerary.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/locations", tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/transport-call", tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/schedule", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/mmt/route-network", tier: optional }

  # Dangerous goods. `mmt/cargo` owns the UN TDG hazard taxonomy (moved there in
  # MMT 2.4.0); this module adds the declaration, segregation and stowage layer.
  - { iri: "https://www.kairosflow.ai/ont/imo/dangerous-goods", tier: recommended }

  # Equipment and vessel identity the forwarder references but does not operate.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/equipment", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/imo/vessel-registry", tier: optional }

  # Trade documents, duty and reference data around the transport document set.
  - { iri: "https://www.kairosflow.ai/ont/bsp/documents", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/bsp/compliance", tier: optional }
  # Declared for `MonetaryAmount`, `Address` and `Country` only — see the omission
  # comment in core_concepts. Its Location/Port/Warehouse classes are deliberately not
  # cited; locations anchor on mmt/locations and dcsa/locations.
  - { iri: "https://www.kairosflow.ai/ont/bsp/reference-data", tier: optional }

  # Customs beyond the declaration itself — who files, on what document, under which
  # facilitation regime. Promoted together by the `customs-role` axis.
  - { iri: "https://www.kairosflow.ai/ont/wco/party", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/wco/documents", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/wco/trade-facilitation", tier: optional }

  # Shipper-facing CO2 reporting (ISO 14083 / GLEC). The forwarder reports emissions
  # for transport it does not run, which is why carbon is in scope and `energy` is not.
  - { iri: "https://www.kairosflow.ai/ont/sustainability/carbon", tier: optional }

  # Grain-3 rail targets. The `modes-served` axis has always named these for a `rail`
  # answer; declaring them here means the axis promotes a module the loader can deliver
  # instead of relying on the mode-target exception (discovery/README.md rule 1).
  - { iri: "https://www.kairosflow.ai/ont/rail/consignment", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/rail/path-request", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/rail/party", tier: optional }

  # Deliberately NOT declared (authoring rule 3, archetypes/README.md):
  #   tic/*                       — terminal-operator scope. A forwarder is a terminal's
  #                                 customer, not its operator; handling operations, yard
  #                                 infrastructure and reefer monitoring belong to the
  #                                 terminal archetype.
  #   dcsa/vessel-journey,        — vessel and box asset operations. The forwarder buys
  #   dcsa/container-operations,    capacity on these; it does not run them. Vessel
  #   dcsa/equipment-journey,       identity is covered by imo/vessel-registry above.
  #   imo/port-call, imo/crew-seafarer, imo/environmental,
  #   imo/maritime-security, imo/certificates-surveys
  #   sustainability/energy       — fuel and bunker consumption belong to whoever burns
  #                                 it. The forwarder reports the resulting emissions
  #                                 (sustainability/carbon), not the energy input.
  #   dcsa/transport-documents    — ocean-specific B/L family. The forwarder anchors on
  #                                 the general mmt/documents#TransportDocument and its
  #                                 master/house split (anchor-selection invariant).
  #   dcsa/party                  — ocean-specific party module; bsp/party + mmt/party
  #                                 already carry the durable party and its role
  #                                 assignments mode-neutrally.

core_concepts:
  # Party identity and role assignment. Roles are modelled via the
  # qualified-role-assignment machinery (BSP 1.6.0 / MMT 2.0.0) — one durable
  # party, 0..n role assignments, each scoped to a context. The per-role
  # subclasses are deprecated standards overlays: recommended for
  # message-level interop, never the hub's role model.
  - { uri: "https://www.kairosflow.ai/ont/bsp/party#TradeParty", tier: required, label: "Trade Party" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/party#TradePartyRoleAssignment", tier: required, label: "Trade Party Role Assignment" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/party#PartyRoleCode", tier: required, label: "Party Role Code (governed list)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#TransportParty", tier: required, label: "Transport Party (abstract identity)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#TransportPartyRoleAssignment", tier: required, label: "Transport Party Role Assignment" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#TransportPartyRoleCode", tier: required, label: "Transport Party Role Code (governed list)" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/party#FreightForwarder", tier: recommended, label: "Freight Forwarder (deprecated trade-role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#FreightForwarder", tier: recommended, label: "Freight Forwarder (deprecated transport-role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#Carrier", tier: recommended, label: "Carrier (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#Consignor", tier: recommended, label: "Consignor (deprecated role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/party#Consignee", tier: recommended, label: "Consignee (deprecated role overlay)" }

  # Demand-side order the forwarder owns, and the reservation slot it procures against.
  # Mode never appears here — it is carried by the leg. See patterns/multimodal-order-leg.
  - { uri: "https://www.kairosflow.ai/ont/blueprint/transport-order#TransportOrder", tier: required, label: "Transport Order" }
  - { uri: "https://www.kairosflow.ai/ont/blueprint/transport-order#CarrierReservation", tier: recommended, label: "Carrier Reservation" }

  # Booking and carrier-facing instructions.
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#Booking", tier: recommended, label: "Carrier Booking" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#Shipment", tier: recommended, label: "Carrier Shipment" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/booking#ShippingInstruction", tier: recommended, label: "Shipping Instruction" }

  # Forwarder consolidation and execution backbone.
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment", tier: required, label: "Consignment" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#MasterConsignment", tier: required, label: "Master Consignment" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#HouseConsignment", tier: required, label: "House Consignment" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#ConsignmentItem", tier: required, label: "Consignment Item" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportRoute", tier: required, label: "Transport Route" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportLeg", tier: required, label: "Transport Leg" }

  # Mode-bearing leg subclasses. These are grain 2 of multimodal-order-leg — the only place a
  # mode may be stated. The `modes-served` scope axis in the discovery guide selects which of
  # them a given forwarder actually needs; the rest are recorded `not-applicable`.
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#InlandLeg", tier: required, label: "Inland Leg (abstract)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#RoadLeg", tier: required, label: "Road Leg" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#RailLeg", tier: required, label: "Rail Leg" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#BargeLeg", tier: required, label: "Barge Leg" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#InlandCarrier", tier: recommended, label: "Inland Carrier" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#HaulageInstructions", tier: recommended, label: "Haulage Instructions (carrier vs merchant haulage)" }

  # Mode-bearing means of transport. Tiered optional: a non-asset forwarder may hold only the
  # carrier's reference. Selected per mode by the `modes-served` axis.
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#LogisticsMeansOfTransport", tier: recommended, label: "Means of Transport (abstract)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#Vessel", tier: optional, label: "Vessel" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#Aircraft", tier: optional, label: "Aircraft" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#RailVehicle", tier: optional, label: "Rail Vehicle" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#RoadVehicle", tier: optional, label: "Road Vehicle" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/transport-means#BargeVessel", tier: optional, label: "Barge Vessel" }

  # Forwarder and carrier documents.
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#TransportDocument", tier: required, label: "Transport Document" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#MasterWaybill", tier: required, label: "Master Waybill" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/documents#HouseWaybill", tier: required, label: "House Waybill" }

  # Cargo, equipment, and locations.
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#Goods", tier: required, label: "Goods" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#Weight", tier: required, label: "Weight" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#Dimension", tier: recommended, label: "Dimension" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#Commodity", tier: recommended, label: "Commodity" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#PackageSpecification", tier: recommended, label: "Package Specification" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#HandlingInstructions", tier: optional, label: "Handling Instructions" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#ShippingMarks", tier: optional, label: "Shipping Marks" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#CargoInsurance", tier: optional, label: "Cargo Insurance" }
  # Hazard classification lives in mmt/cargo (MMT 2.4.0); the declaration, segregation
  # and stowage layer is imo/dangerous-goods, below.
  - { uri: "https://www.kairosflow.ai/ont/mmt/cargo#DangerousGoods", tier: recommended, label: "Dangerous Goods" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#TransportEquipment", tier: recommended, label: "Transport Equipment" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/equipment#FreightContainer", tier: recommended, label: "Freight Container" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/locations#Location", tier: required, label: "Location" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/locations#TransportLocation", tier: required, label: "Transport Location" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/locations#Warehouse", tier: recommended, label: "Warehouse" }

  # Visibility and regulatory coordination.
  - { uri: "https://www.kairosflow.ai/ont/dcsa/events#Event", tier: recommended, label: "Event (abstract)" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/events#TransportEvent", tier: recommended, label: "Transport Event" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/events#EquipmentEvent", tier: recommended, label: "Equipment Event" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/events#DocumentEvent", tier: recommended, label: "Document Event" }

  # Mode-neutral milestones. The DCSA set above is ocean-shaped; these are the events a
  # road, rail or barge leg actually produces. Both sets coexist deliberately — a
  # multimodal forwarder sees vessel departures and truck pickups on the same job.
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#PickupEvent", tier: recommended, label: "Pickup Event" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#DeliveryEvent", tier: recommended, label: "Delivery Event" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#LoadingEvent", tier: recommended, label: "Loading Event" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#DischargeEvent", tier: recommended, label: "Discharge Event" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#TransferEvent", tier: optional, label: "Transfer Event (cross-dock / inter-leg handover)" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#CustomsClearanceEvent", tier: optional, label: "Customs Clearance Event" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#WarehouseStorageEvent", tier: optional, label: "Warehouse Storage Event" }
  - { uri: "https://www.kairosflow.ai/ont/mmt/events#InspectionEvent", tier: optional, label: "Inspection Event" }

  # Customs. Promoted from optional in 1.34.0 — filing or preparing a declaration is the
  # normal forwarder case; the `customs-role` axis pre-seeds not-applicable for a
  # track-only operation.
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#CustomsDeclaration", tier: recommended, label: "Customs Declaration" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#ImportDeclaration", tier: recommended, label: "Import Declaration" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#ExportDeclaration", tier: recommended, label: "Export Declaration" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#TransitDeclaration", tier: recommended, label: "Transit Declaration (T1 / NCTS)" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#GoodsItem", tier: recommended, label: "Customs Goods Item (declaration grain)" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#DeclarationStatus", tier: recommended, label: "Declaration Status" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#Filing", tier: optional, label: "Filing" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#CustomsProcedure", tier: optional, label: "Customs Procedure" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#TariffClassification", tier: optional, label: "Tariff Classification (customs view)" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#CustomsValue", tier: optional, label: "Customs Value" }
  - { uri: "https://www.kairosflow.ai/ont/wco/customs#DutyCalculation", tier: optional, label: "Duty Calculation" }

  # Who files, and under what standing. A forwarder is rarely the declarant on its own
  # account — separating declarant from broker from importer is the whole point.
  - { uri: "https://www.kairosflow.ai/ont/wco/party#Declarant", tier: optional, label: "Declarant" }
  - { uri: "https://www.kairosflow.ai/ont/wco/party#CustomsBroker", tier: optional, label: "Customs Broker" }
  - { uri: "https://www.kairosflow.ai/ont/wco/party#FreightAgent", tier: optional, label: "Freight Agent (customs role overlay)" }
  - { uri: "https://www.kairosflow.ai/ont/wco/party#Importer", tier: optional, label: "Importer" }
  - { uri: "https://www.kairosflow.ai/ont/wco/party#Exporter", tier: optional, label: "Exporter" }
  - { uri: "https://www.kairosflow.ai/ont/wco/party#AEOHolder", tier: optional, label: "AEO Holder" }

  # Customs and trade-facilitation paperwork.
  - { uri: "https://www.kairosflow.ai/ont/wco/documents#SADForm", tier: optional, label: "SAD Form" }
  - { uri: "https://www.kairosflow.ai/ont/wco/documents#TransitDocument", tier: optional, label: "Transit Document" }
  - { uri: "https://www.kairosflow.ai/ont/wco/documents#ATACarnet", tier: optional, label: "ATA Carnet" }
  - { uri: "https://www.kairosflow.ai/ont/wco/documents#TIRCarnet", tier: optional, label: "TIR Carnet" }
  - { uri: "https://www.kairosflow.ai/ont/wco/trade-facilitation#CertificateOfOrigin", tier: optional, label: "Certificate of Origin (customs view)" }
  - { uri: "https://www.kairosflow.ai/ont/wco/trade-facilitation#License", tier: optional, label: "Licence" }
  - { uri: "https://www.kairosflow.ai/ont/wco/trade-facilitation#ImportPermit", tier: optional, label: "Import Permit" }
  - { uri: "https://www.kairosflow.ai/ont/wco/trade-facilitation#ExportPermit", tier: optional, label: "Export Permit" }
  - { uri: "https://www.kairosflow.ai/ont/wco/trade-facilitation#AEOCertification", tier: optional, label: "AEO Certification" }
  - { uri: "https://www.kairosflow.ai/ont/wco/trade-facilitation#SingleWindow", tier: optional, label: "Single Window" }
  - { uri: "https://www.kairosflow.ai/ont/wco/trade-facilitation#eFTIRecord", tier: optional, label: "eFTI Record" }

  # ─── Charges, invoicing and settlement ───────────────────────────────────────
  # The forwarder's commercial core, and the gap gh#104 filed: a real forwarder charge
  # table carries cost and sell on one line, links to both an AP and an AR document, and
  # is the margin model in a single record. `Charge` is the anchor for that line;
  # `Invoice` and `BillingDocumentLine` are the anchors for the AR/AP document set.
  # Deliberately anchored on the general bsp/financial classes rather than a mode- or
  # standard-specific charge, per the anchor-selection invariant.
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#Charge", tier: required, label: "Charge (cost and/or sell line on a job)" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#FreightCharge", tier: required, label: "Freight Charge" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#FreightRate", tier: required, label: "Freight Rate" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#Invoice", tier: required, label: "Invoice" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#BillingDocumentLine", tier: required, label: "Billing Document Line (invoice / credit-note / debit-note line)" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#InvoiceLine", tier: recommended, label: "Invoice Line" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#CommercialInvoice", tier: recommended, label: "Commercial Invoice" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#Surcharge", tier: recommended, label: "Surcharge" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#PaymentTerms", tier: recommended, label: "Payment Terms" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#Payment", tier: recommended, label: "Payment" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#CreditNote", tier: optional, label: "Credit Note" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#CreditNoteLine", tier: optional, label: "Credit Note Line" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#DebitNote", tier: optional, label: "Debit Note" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#DebitNoteLine", tier: optional, label: "Debit Note Line" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#ProformaInvoice", tier: optional, label: "Proforma Invoice" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#PaymentAllocation", tier: optional, label: "Payment Allocation" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#Reconciliation", tier: optional, label: "Reconciliation" }
  - { uri: "https://www.kairosflow.ai/ont/bsp/financial#AgingBucket", tier: optional, label: "Aging Bucket (AR outstanding)" }
