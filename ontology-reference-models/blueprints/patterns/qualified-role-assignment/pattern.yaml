id: qualified-role-assignment
problem: >
  A durable identity plays different roles in different contexts over time. Modelling the role
  directly onto the identity conflates identity with a transient, context-dependent usage and
  duplicates identity records the moment one identity holds two roles concurrently.
applicability: >
  The role is contextual, temporally bounded independent of the identity's own lifecycle, or held
  concurrently across several contexts.
closes_gap: [1, 2, 7]
normativity:
  naming: normative
  participants: advisory
  cardinality_rules: advisory
naming_conventions:
  - element: role_assignment_class
    convention: "<Identity>RoleAssignment"
    example: PartyRoleAssignment
  - element: link_to_identity
    convention: "assignedTo<Identity>"
    example: assignedToParty
  - element: link_to_context
    convention: "inContextOf<Context>"
    example: inContextOfBooking
  - element: role_value_property
    convention: hasRole
    example: hasRole
physical_simplification:
  allowed_when:
    - "the first slice does not need role history"
    - "one identity never holds a role concurrently with a conflicting one"
    - "the flags are documented as a denormalised projection of the role-assignment link entity, never as the semantic model itself"
  shape: "boolean flag per role directly on the identity, e.g. isCarrier, isForwarder"
anti_patterns:
  - id: subclass-identity-by-role
    description: "Identity is subclassed by role, e.g. Shipper subClassOf Party."
    rejection_reason: "Breaks the moment one organisation plays two roles; requires re-typing on role change."
    # Exempt role parents are STANDARDS OVERLAYS with LIVE role subclasses:
    # derived modules mirroring their source standard's role-typed party
    # contexts for fidelity and message-level interop. The BSP/MMT role
    # subclasses need no entry here — they are owl:deprecated (BSP 1.6.0 /
    # MMT 2.0.0, superseded by TradePartyRoleAssignment /
    # TransportPartyRoleAssignment) and deprecated subjects are outside
    # detection; un-deprecating one revives the warning, which is the
    # guard working. See CONTRACT.md, "Patterns vs derived modules", and
    # overlap-register.yaml 'party-role-parents' for the parked
    # durable-party-identity stakeholder decision.
    exemptions:
      - name: https://www.kairosflow.ai/ont/dcsa/party#ShippingParty
        reason: "DCSA standards overlay mirroring DCSA's role-typed party shape; hybrid role-assignment machinery pending the party-identity stakeholder decision (overlap-register.yaml 'party-role-parents')."
      - name: https://www.kairosflow.ai/ont/imo/party#MaritimeParty
        reason: "IMO standards overlay mirroring the IMO Compendium's role-typed party shape; hybrid role-assignment machinery pending the same party-identity stakeholder decision."
  - id: equal-labels-treated-as-equivalent
    description: "BSP TradeParty, DCSA ShippingParty, and MMT TransportParty treated as owl:equivalentClass without checking grain."
    rejection_reason: "Similar labels do not establish equivalence; each may be a role overlay on the same identity or a distinct grain."
grain_collisions:
  - "Party: BSP, DCSA, MMT, IMO, and TIC each define a role-bearing party parent with a different context; none is the durable identity on its own."
  - "Location: DCSA specialises Location by shipment role (Port of Loading, Port of Discharge); materialising those as separate physical places duplicates one port playing several roles."
