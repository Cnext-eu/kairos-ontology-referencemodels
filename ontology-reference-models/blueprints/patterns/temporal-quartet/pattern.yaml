id: temporal-quartet
problem: >
  Transport aggregates commonly distinguish requested, planned, estimated, and actual timestamps
  for a start/arrival and an end/departure event. Without a shared naming convention, each class
  independently invents its own words for the same eight timestamps.
applicability: >
  Any class distinguishing what was asked for, planned, estimated, or actually observed for a
  start/arrival or end/departure event.
closes_gap: [8]
normativity:
  naming: normative
  participants: advisory
  cardinality_rules: advisory
naming_conventions:
  - qualifier: requested
    start_or_arrival: requestedStart
    arrival_variant: requestedArrival
    end_or_departure: requestedEnd
    departure_variant: requestedDeparture
  - qualifier: planned
    start_or_arrival: plannedStart
    arrival_variant: plannedArrival
    end_or_departure: plannedEnd
    departure_variant: plannedDeparture
  - qualifier: estimated
    start_or_arrival: estimatedStart
    arrival_variant: estimatedArrival
    end_or_departure: estimatedEnd
    departure_variant: estimatedDeparture
  - qualifier: actual
    start_or_arrival: actualStart
    arrival_variant: actualArrival
    end_or_departure: actualEnd
    departure_variant: actualDeparture
naming_rule: >
  Use Start/End for duration-bearing activities and Arrival/Departure for point-of-presence
  events. Never mix vocabularies on one class — this clause is mechanically checkable against
  the 16 names published in naming_conventions above. Never substitute a synonym for estimated
  or requested; the closed banned-token list lives on the synonym-for-estimated-or-requested
  anti-pattern below, with matching semantics defined in pattern.md.
anti_patterns:
  - id: synonym-for-estimated-or-requested
    description: "A temporal property named with a synonym token (eta, etd, ata, atd, expected, due) instead of the published estimated*/requested*/actual* names."
    rejection_reason: "This is the exact naming drift this pattern was shipped normative to stop."
    # Matching semantics (normative, defined in pattern.md "Synonym ban — matching semantics"):
    # scope is datatype properties whose declared rdfs:range is in applies_to_ranges; the
    # property local name is tokenised on camelCase/snake_case boundaries with acronym runs
    # kept whole (requestedETA -> [requested, eta]); a name violates iff any WHOLE token
    # equals a banned token. Exemptions are exact, case-sensitive local-name matches (any
    # namespace) and each entry MUST carry a reason citing the source standard or term of art.
    banned_name_tokens: [eta, etd, ata, atd, expected, due]
    applies_to_ranges: ["xsd:dateTime", "xsd:date", "xsd:time"]
    exemptions:
      # Domain terms of art — deadlines, not quartet-event timestamps.
      - name: dueDate
        reason: "BSP financial term of art — payment due date (bsp/financial), not a quartet-event timestamp."
      - name: dischargeDueDate
        reason: "WCO customs term of art (wco/customs) — discharge deadline, not a quartet-event timestamp."
      - name: reviewDueDate
        reason: "IMO maritime-security term of art (imo/maritime-security) — review deadline, not a quartet-event timestamp."
      # Source-fidelity exemptions — the derived module mirrors a cited source
      # element name; source fidelity wins over the pattern (CONTRACT.md,
      # "Patterns vs derived modules"). Full IRIs: exempt the cited module's
      # term only, not every reuse of the name.
      - name: https://www.kairosflow.ai/ont/mmt/consignment#availabilityDueDateTime
        reason: "UN/CEFACT RABIE v101 SupplyChainConsignment.AvailabilityDueDateTime — cited source element."
      - name: https://www.kairosflow.ai/ont/rail/train-running#actualArrivalTime
        reason: "TAF TSI ArrivalTimeAtLocationActual (EU 1305/2012 Annex D.2) — cited source element."
      - name: https://www.kairosflow.ai/ont/rail/train-running#actualDepartureTime
        reason: "TAF TSI DepartureTimeAtLocationActual (EU 1305/2012 Annex D.2) — cited source element."
      - name: https://www.kairosflow.ai/ont/dcsa/events#estimatedTimeOfArrival
        reason: "DCSA Track & Trace field name (eventDateTime classifier EST + ARRI) — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/dcsa/events#estimatedTimeOfDeparture
        reason: "DCSA Track & Trace field name — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/dcsa/events#actualTimeOfArrival
        reason: "DCSA Track & Trace field name — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/dcsa/events#actualTimeOfDeparture
        reason: "DCSA Track & Trace field name — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/dcsa/booking#plannedArrivalDate
        reason: "DCSA Booking (BKG) field name — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/dcsa/booking#plannedDepartureDate
        reason: "DCSA Booking (BKG) field name — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/imo/port-call#estimatedTimeOfArrival
        reason: "IMO Compendium / port-call message term (ETA) — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/imo/port-call#estimatedTimeOfDeparture
        reason: "IMO Compendium / port-call message term (ETD) — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/imo/port-call#actualTimeOfArrival
        reason: "IMO Compendium / port-call message term (ATA) — cited source vocabulary."
      - name: https://www.kairosflow.ai/ont/imo/port-call#actualTimeOfDeparture
        reason: "IMO Compendium / port-call message term (ATD) — cited source vocabulary."
  - id: overwrite-actual-in-place
    description: "A correction to an actual* value overwrites the existing literal instead of appending a new observation."
    rejection_reason: "Actual values are immutable once recorded; corrections are new events, not mutations."
grain_collisions: []
