  - { uri: "https://www.kairosflow.ai/ont/dcsa/transport-documents#BillOfLading",          tier: required,    label: "Bill of Lading" }
  - { uri: "https://www.kairosflow.ai/ont/dcsa/transport-documents#ElectronicBillOfLading", tier: recommended, label: "Electronic Bill of Lading (eBL)" }
