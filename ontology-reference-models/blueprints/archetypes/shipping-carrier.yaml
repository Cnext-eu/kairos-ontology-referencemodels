schema_version: 1
id: shipping-carrier
label: "Shipping line / ocean or short-sea carrier"
description: >
  Companies that operate vessels (owned or chartered) and offer cargo transport
  services to shippers under their own bill of lading. Typical scope covers the
  full liner shipment lifecycle — from booking through transport-document
  issuance, vessel operations, equipment management, port-call execution,
  customs filing, demurrage & detention billing, dangerous-goods compliance,
  vessel statutory certification, and emissions reporting (CII / EU ETS).
  Sub-flavours include deep-sea container lines, short-sea / feeder operators,
  ro-ro and breakbulk carriers, and barge / inland-waterway operators; the
  required tier represents the common backbone, while recommended/optional
  tiers cover the variation across these sub-flavours.

compatible_with:
  repo_tag_range: ">=1.10.0,<2.0.0"
  ontology_versions:
    DCSA:           ">=1.3.0,<2"
    MMT:            ">=1.1.0,<2"
    IMO:            ">=1.0.0,<2"
    WCO:            ">=1.2.0,<2"
    Sustainability: ">=1.0.0,<2"

# ─── Ref-model modules ─────────────────────────────────────────────────────────
# Tier reflects whether the *module* is expected to be touched by a typical
# carrier's data model. Specific class-level expectations are in core_concepts.
ref_model_modules:
  # Commercial cycle (booking → B/L → shipment).
  - { iri: "https://www.kairosflow.ai/ont/dcsa/booking",             tier: required }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/shipment-journey",    tier: required }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/transport-documents", tier: required }
  - { iri: "https://www.kairosflow.ai/ont/mmt/documents",            tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/mmt/consignment",          tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/mmt/cargo",                tier: recommended }

  # Parties, locations, transport calls.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/party",               tier: required }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/locations",           tier: required }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/transport-call",      tier: required }

  # Vessels and means of transport.
  - { iri: "https://www.kairosflow.ai/ont/mmt/transport-means",      tier: required }
  - { iri: "https://www.kairosflow.ai/ont/imo/vessel-registry",      tier: recommended }

  # Inland legs under carrier haulage. Optional because a port-to-port carrier has none; the
  # `geographic-scope` / `modes-served` axes in discovery/shipping-carrier.md promote it when
  # the carrier sells door-to-door. Declared here so an axis never selects an undeclared
  # module — see accelerator-packs/logistics/discovery/README.md resolution rule 1.
  - { iri: "https://www.kairosflow.ai/ont/mmt/inland-transport",     tier: optional }

  # Schedule & vessel journey.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/vessel-journey",      tier: required }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/schedule",            tier: required }
  - { iri: "https://www.kairosflow.ai/ont/imo/port-call",            tier: recommended }

  # Equipment / container operations.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/equipment",           tier: required }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/equipment-journey",   tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/container-operations", tier: recommended }

  # Track and trace.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/track-and-trace",     tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/dcsa/events",              tier: recommended }

  # Demurrage and detention.
  - { iri: "https://www.kairosflow.ai/ont/dcsa/demurrage-detention", tier: recommended }

  # Dangerous goods & regulatory compliance.
  - { iri: "https://www.kairosflow.ai/ont/imo/dangerous-goods",      tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/imo/certificates-surveys", tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/imo/maritime-security",    tier: optional }
  - { iri: "https://www.kairosflow.ai/ont/imo/environmental",        tier: optional }

  # Customs and trade facilitation.
  - { iri: "https://www.kairosflow.ai/ont/wco/customs",              tier: recommended }
  - { iri: "https://www.kairosflow.ai/ont/wco/trade-facilitation",   tier: optional }

  # Sustainability — CII, EEXI, EU ETS, carbon footprint reporting.
  - { iri: "https://www.kairosflow.ai/ont/sustainability/carbon",    tier: optional }

# ─── Core concepts ─────────────────────────────────────────────────────────────
# Grouped by business area. Tiers:
#   required    — every shipping carrier is expected to model this
#   recommended — most carriers have it; sub-flavours may legitimately omit
#   optional    — present only when the carrier is in scope for that regulation
#                 / sub-flavour / capability
