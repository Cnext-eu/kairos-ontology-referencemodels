# Data Domain Registry — Logistics Client Hub Blueprint
#
# This file defines the recommended data domains for a logistics ontology hub.
# Each domain specifies which Kairos reference model modules to owl:imports.
#
# Usage:
#   - Tooling can read this file to scaffold a new client project
#   - Humans can use it as a lookup for "which module do I import for X?"
#
# Structure:
#   L1 groups → L2 domains → import URIs + metadata

schema_version: "1.0"

groups:
  - id: party-commercial
    name: "Party & Commercial"
    question: "Who are we doing business with, under what terms, at what price?"
    domains:

      - id: party
        name: "Party, Role & Organisation"
        folder: "model/ontologies/party/"
        owns: "Legal entities, customers, suppliers, carriers, terminal operators, agents, authorities, contacts, roles, and organisational hierarchy."
        does_not_own: "Contracts, bookings, invoices, operational events, or terminal moves."
        imports:
          - uri: "https://www.kairosflow.ai/ont/bsp/party#"
            module: "BSP / Party"
            provides: "Party, Organisation, Customer, Supplier, role assignments, contact persons"
          - uri: "https://www.kairosflow.ai/ont/mmt/party#"
            module: "MMT / Party"
            provides: "Carrier, transport service provider, consignee, consignor"
          - uri: "https://www.kairosflow.ai/ont/imo/party#"
            module: "IMO / Party"
            provides: "Classification society, CSO, SSO, PFSO, PSCO (maritime security roles)"
          - uri: "https://www.kairosflow.ai/ont/rail/party#"
            module: "RAIL / Party"
            provides: "Railway undertaking (RU), infrastructure manager (IM), lead RU, wagon keeper"
            mode: rail
        standards:
          - "UN/CEFACT CCL"
          - "ISO 20197-1:2024 BSP-RDM"
          - "IMO Compendium"
          - "TAF TSI (EU Regulation 1305/2012, Annex D.2 Appendix F)"

      - id: commercial
        name: "Customer, Contract & Commercial Agreement"
        folder: "model/ontologies/commercial/"
        owns: "Commercial relationships, service agreements, trade terms, customer commitments, pricing conditions at contract level."
        does_not_own: "Surcharge calculation, invoice posting, booking execution, or terminal tariff events."
        imports:
          - uri: "https://www.kairosflow.ai/ont/bsp/commercial#"
            module: "BSP / Commercial"
            provides: "Contract, agreement, trade terms, service commitments"
        standards:
          - "ISO 20197-1:2024 BSP-RDM"
          - "UN/CEFACT SCRDM"

      - id: booking
        name: "Booking, Quote & Order Management"
        folder: "model/ontologies/booking/"
        owns: "Booking requests, quotes, transport orders, customer instructions, booking confirmation, and booking lifecycle."
        does_not_own: "Transport execution events, invoices, vessel schedules, terminal handling, or the transport mode of any individual leg."
        grain_note: >
          "Transport orders" and "bookings" are distinct grains, not synonyms. The demand-side
          order is one commercial request owned by the arranging party
          (blueprint/transport-order#TransportOrder); a booking is one carrier's capacity
          reservation (dcsa/booking#Booking). One order may procure several bookings across
          several carriers and modes. Mode belongs to the leg, never to either of these — see
          blueprints/patterns/multimodal-order-leg.
        mode_note: >
          The carrier reservation is grain 3 in blueprints/patterns/multimodal-order-leg, and
          that is the only place a mode-specific standard enters this domain. Each mode binds
          its own reservation shape — ocean via DCSA Booking, rail via the TAF TSI path request
          and consignment order, air via IATA ONE Record — while the order above them stays
          mode-neutral. Road and barge have no dominant reservation standard and are modelled
          as a plain CarrierReservation. Import only the modes the client actually serves; the
          modes-served scope axis in discovery/README.md decides which.
        imports:
          - uri: "https://www.kairosflow.ai/ont/blueprint/transport-order#"
            module: "Blueprint / Transport Order"
            provides: "Transport order aggregate root, carrier reservation extension point"
          - uri: "https://www.kairosflow.ai/ont/dcsa/booking#"
            module: "DCSA / Booking"
            provides: "Booking, shipping instruction, confirmation, amendment"
            mode: ocean
          - uri: "https://www.kairosflow.ai/ont/rail/path-request#"
            module: "RAIL / Path Request"
            provides: "Path request, path confirmation, pre-arranged and on-demand path, path details"
            mode: rail
          - uri: "https://www.kairosflow.ai/ont/rail/consignment#"
            module: "RAIL / Consignment Order"
            provides: "Consignment order message, consignment-level data, consignment identification"
            mode: rail
          - uri: "https://onerecord.iata.org/ns/cargo#"
            module: "IATA ONE Record / Cargo"
            provides: "Booking, booking request, booking option, booking shipment"
            mode: air
            import_policy: reference-only
            note: >
              Vendored under authoritative-ontologies/IATA/ and resolved through the catalog.
              The accelerator pack deliberately never imports it (mirrors the FIBO exclusion),
              but a client hub serving air cargo binds to it here, hub-local, at grain 3.
          - uri: "https://www.kairosflow.ai/ont/bsp/documents#"
            module: "BSP / Documents"
            provides: "Order document, commercial instruction"
        standards:
          - "DCSA Booking API"
          - "ISO 20197-1:2024 BSP-RDM"
          - "TAF TSI (EU Regulation 1305/2012, Annex D.2 Appendix F)"
          - "IATA ONE Record (cargo data model, RDF/OWL)"

      - id: financial
        name: "Tariff, Surcharge, Invoice, Settlement & Operational Finance"
        folder: "model/ontologies/financial/"
        owns: "Tariff structures, surcharges (BAF, CAF, THC, PSS), freight charges, demurrage and detention, invoices, credit notes, settlement, payment allocation, trade finance (L/C, documentary collection), cost allocation, cost-to-serve, budget variance, revenue attribution, yield metrics, load factor, and profitability analysis."
        does_not_own: "Customer contracts, booking lifecycle, emissions methodology, operational events, general ledger chart-of-accounts, or working capital metrics (DSO, DPO, cash conversion cycle) — those are client extensions."
        extension_note: >
          This domain covers the full operational finance lifecycle: charges and surcharges
          (BSP), demurrage and detention (DCSA), cost allocation and budgeting, and
          revenue/yield analytics. Working capital metrics — DSO, DPO, cash conversion cycle —
          are deliberately absent and belong in client extensions, because their calculation
          methods are implementation-specific and no standard fixes them. Adopting a shared
          definition here would encode one company's accounting policy as though it were
          industry semantics.
        overlaps:
          - class: FreeTimePeriod
            candidates: [BSP/Financial, DCSA/Demurrage-Detention]
            resolved_to: DCSA/Demurrage-Detention
            rationale: "DCSA D&D standard is authoritative for container free-time definitions."
        imports:
          - uri: "https://www.kairosflow.ai/ont/bsp/financial#"
            module: "BSP / Financial"
            provides: "Invoice, charge, surcharge taxonomy, payment, settlement, tariff schedule, trade finance, bank account, credit limit"
          - uri: "https://www.kairosflow.ai/ont/dcsa/demurrage-detention#"
            module: "DCSA / Demurrage & Detention"
            provides: "Demurrage charge, detention charge, free-time allowance, per-diem rates, D&D disputes"
          - uri: "https://www.kairosflow.ai/ont/bsp/cost-accounting#"
            module: "BSP / Cost Accounting"
            provides: "Cost allocation, cost center, cost-per-unit, cost-to-serve, budget, variance"
          - uri: "https://www.kairosflow.ai/ont/bsp/revenue-yield#"
            module: "BSP / Revenue & Yield"
            provides: "Revenue item, yield per unit, load factor, rate card, contribution margin, profitability"
        standards:
          - "ISO 20197-1:2024 BSP-RDM"
          - "UN/CEFACT CII"
          - "DCSA Demurrage & Detention API"

  - id: transport-cargo
    name: "Transport & Cargo"
    question: "What is being moved, by which route and asset?"
    domains:

      - id: consignment
        name: "Consignment, Shipment & Transport Movement"
        folder: "model/ontologies/consignment/"
        owns: "Consignments, shipments, transport legs, multimodal chains, handovers, and transport status."
        does_not_own: "Terminal micro-events, commercial pricing, customs declarations, or vehicle service details."
        imports:
          - uri: "https://www.kairosflow.ai/ont/mmt/consignment#"
            module: "MMT / Consignment"
            provides: "Consignment, shipment, transport movement, leg, handover"
          - uri: "https://www.kairosflow.ai/ont/dcsa/shipment-journey#"
            module: "DCSA / Shipment Journey"
            provides: "Shipment, transport plan, carrier service"
        standards:
          - "UN/CEFACT MMT-RDM"
          - "DCSA API Standards"

      - id: cargo
        name: "Cargo, Goods & Cargo Unit"
        folder: "model/ontologies/cargo/"
        owns: "Cargo description, goods classification, packages, weights, dimensions, commodity attributes, and handling requirements."
        does_not_own: "Transport equipment, terminal moves, automotive services, or DG regulatory rules."
        overlaps:
          - class: Dimension
            candidates: [BSP/Reference, MMT/Cargo]
            resolved_to: MMT/Cargo
            rationale: "Physical dimensions relate to cargo handling in transport."
          - class: Weight
            candidates: [BSP/Reference, MMT/Cargo]
            resolved_to: MMT/Cargo
            rationale: "Weight is cargo-operational context."
        imports:
          - uri: "https://www.kairosflow.ai/ont/mmt/cargo#"
            module: "MMT / Cargo"
            provides: "Cargo item, goods, package, weight, dimension, commodity"
        standards:
          - "UN/CEFACT MMT-RDM"
          - "UN/CEFACT CCL"

      - id: equipment
        name: "Cargo Equipment & Fleet Equipment"
        folder: "model/ontologies/equipment/"
        owns: "Trailers, containers, tank containers, reefer units, chassis, swap bodies, equipment identifiers, and equipment status."
        does_not_own: "Vessel fleet, terminal cranes, cargo contents, or operational moves."
        imports:
          - uri: "https://www.kairosflow.ai/ont/mmt/equipment#"
            module: "MMT / Equipment"
            provides: "Transport equipment, trailer, container types"
          - uri: "https://www.kairosflow.ai/ont/dcsa/equipment#"
            module: "DCSA / Equipment"
            provides: "Container, reefer, ISO equipment codes"
        standards:
          - "UN/CEFACT MMT-RDM"
          - "DCSA API Standards"

      - id: route-schedule
        name: "Route, Network, Schedule & Service"
        folder: "model/ontologies/route-schedule/"
        owns: "Service network, routes, corridors, sailing schedules, service loops, cut-offs, and transit times."
        does_not_own: "Actual cargo loaded, terminal moves, invoices, or customer contracts."
        imports:
          - uri: "https://www.kairosflow.ai/ont/dcsa/schedule#"
            module: "DCSA / Schedule"
            provides: "Vessel schedule, port call plan, cut-off, service loop"
          - uri: "https://www.kairosflow.ai/ont/mmt/route-network#"
            module: "MMT / Route Network"
            provides: "Route, corridor, network connection, transit time"
          - uri: "https://www.kairosflow.ai/ont/dcsa/transport-call#"
            module: "DCSA / Transport Call"
            provides: "Transport call, vessel-location linkage, schedule-to-location"
        standards:
          - "DCSA Operational Vessel Schedules"
          - "UN/CEFACT MMT-RDM"

      - id: intermodal
        name: "Intermodal Rail, Barge & Inland Execution"
        folder: "model/ontologies/intermodal/"
        owns: "Inland legs, rail/barge connections, road execution, terminal-to-terminal handovers, inland route execution, train running and rolling-stock composition."
        does_not_own: "Maritime voyage execution, terminal yard moves, cargo master data, customer contracts, or the rail path/consignment reservation (that is booking, grain 3)."
        grain_note: >
          This domain is movement grain (grain 4): what actually ran, with which wagons. The
          rail *reservation* — path request and consignment order — belongs to booking, one
          grain above. Splitting them is what lets a hub reserve a path it never ran, and run
          a service against a path reserved months earlier.
        imports:
          - uri: "https://www.kairosflow.ai/ont/mmt/inland-transport#"
            module: "MMT / Inland Transport"
            provides: "Inland leg, rail connection, barge connection, road transport"
          - uri: "https://www.kairosflow.ai/ont/rail/train-running#"
            module: "RAIL / Train Running"
            provides: "Train running information, running forecast, train delay and interruption"
            mode: rail
          - uri: "https://www.kairosflow.ai/ont/rail/rolling-stock#"
            module: "RAIL / Rolling Stock"
            provides: "Wagon, locomotive, train composition, wagon technical data"
            mode: rail
        standards:
          - "UN/CEFACT MMT-RDM"
          - "TAF TSI (EU Regulation 1305/2012, Annex D.2 Appendix F)"

  - id: maritime-terminal
    name: "Maritime & Terminal"
    question: "What happens on vessels, at berths, gates, and yards?"
    domains:

      - id: vessel-maritime
        name: "Vessel, Fleet & Maritime Operations"
        folder: "model/ontologies/vessel-maritime/"
        owns: "Vessels, vessel characteristics, voyages, sea legs, port calls, berthing, fleet capabilities, statutory certificates, crew management, environmental compliance (SEEMP, BWMP, SOPEP), and maritime security (ISPS, ship security plans)."
        does_not_own: "Terminal yard moves, customer bookings, cargo commercial terms, or emissions formulas."
        overlaps:
          - class: ClassificationSociety
            candidates: [IMO/Party, IMO/Vessel-Registry]
            resolved_to: IMO/Party
            rationale: "Both are IMO — use Party module for the organizational entity."
        imports:
          - uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#"
            module: "IMO / Vessel Registry"
            provides: "Vessel, IMO number, flag state, vessel type"
          - uri: "https://www.kairosflow.ai/ont/dcsa/vessel-journey#"
            module: "DCSA / Vessel Journey"
            provides: "Voyage, sea leg, vessel operational status"
          - uri: "https://www.kairosflow.ai/ont/imo/port-call#"
            module: "IMO / Port Call"
            provides: "Port call, arrival, departure, berth stay"
          - uri: "https://www.kairosflow.ai/ont/imo/certificates-surveys#"
            module: "IMO / Certificates & Surveys"
            provides: "Statutory certificate, flag state survey, class survey, classification society"
          - uri: "https://www.kairosflow.ai/ont/imo/crew-seafarer#"
            module: "IMO / Crew & Seafarer"
            provides: "Seafarer, crew member, crew list, certificate of competency"
          - uri: "https://www.kairosflow.ai/ont/imo/environmental#"
            module: "IMO / Environmental"
            provides: "SEEMP, BWMP, SOPEP, garbage management plan, emission control areas"
          - uri: "https://www.kairosflow.ai/ont/imo/maritime-security#"
            module: "IMO / Maritime Security"
            provides: "Ship security plan, PFSP, ISPS code compliance, DoS"
          - uri: "https://www.kairosflow.ai/ont/imo/locations#"
            module: "IMO / Locations"
            provides: "Port, emission control area, MARPOL special area, port reception facility"
        standards:
          - "IMO Compendium / FAL"
          - "DCSA API Standards"

      - id: terminal-operations
        name: "Terminal, Yard, Berth, Gate & Handling Operations"
        folder: "model/ontologies/terminal-operations/"
        owns: "Terminal infrastructure, yard areas, gates, berths, storage zones, stevedoring, load/discharge moves, and handling instructions."
        does_not_own: "Customer contracts, route network, vessel master data, cargo semantics, or customs declarations."
        imports:
          - uri: "https://www.kairosflow.ai/ont/tic/terminal-infrastructure#"
            module: "TIC / Terminal Infrastructure"
            provides: "Terminal, berth, yard, gate, storage zone, rail head"
          - uri: "https://www.kairosflow.ai/ont/tic/handling-operations#"
            module: "TIC / Handling Operations"
            provides: "Stevedoring, load/discharge move, handling instruction, move sequence"
          - uri: "https://www.kairosflow.ai/ont/tic/locations#"
            module: "TIC / Locations"
            provides: "Terminal location, yard position, berth position"
          - uri: "https://www.kairosflow.ai/ont/tic/kpi#"
            module: "TIC / KPI"
            provides: "KPI definitions, berth productivity, crane productivity, dwell time, yard utilization"
        standards:
          - "TIC 4.0"
          - "BSI PAS 4000:2026"

      - id: roro
        name: "RoRo Operations"
        folder: "model/ontologies/roro/"
        owns: "RoRo-specific cargo concepts: trailers, self-drive units, rolling machinery, lane-metre planning, RoRo load/discharge context."
        does_not_own: "Generic cargo master data, vessel master data, terminal yard moves, or commercial charges."
        imports:
          - uri: "https://www.kairosflow.ai/ont/mmt/cargo#"
            module: "MMT / Cargo"
            provides: "Base cargo classification for rolling cargo"
          - uri: "https://www.kairosflow.ai/ont/tic/handling-operations#"
            module: "TIC / Handling Operations"
            provides: "RoRo handling context"
        note: "Primarily a client extension domain. Reference models provide base classes; client adds RoRo-specific subclasses and properties."
        standards:
          - "UN/CEFACT MMT-RDM"
          - "TIC 4.0"

      - id: automotive
        name: "Automotive Logistics & Vehicle Services"
        folder: "model/ontologies/automotive/"
        owns: "Vehicle-unit lifecycle, PDI, wash, enhancement, modification, technical service, body repair, storage, and release readiness."
        does_not_own: "Generic RoRo handling, general cargo classification, terminal yard master data, or contract terms."
        imports:
          - uri: "https://www.kairosflow.ai/ont/tic/automotive-services#"
            module: "TIC / Automotive Services"
            provides: "Vehicle service types, PDI, wash, repair, storage"
        standards:
          - "TIC 4.0"

  - id: compliance-sustainability
    name: "Compliance & Sustainability"
    question: "What must be reported or restricted?"
    domains:

      - id: dangerous-goods
        name: "Dangerous Goods & Cargo Restrictions"
        folder: "model/ontologies/dangerous-goods/"
        owns: "DG restrictions, hazardous cargo attributes, acceptance rules, route/terminal/vessel restrictions, and regulatory classes."
        does_not_own: "All cargo classification, customs declarations, booking lifecycle, or incident response."
        imports:
          - uri: "https://www.kairosflow.ai/ont/imo/dangerous-goods#"
            module: "IMO / Dangerous Goods"
            provides: "DG item, hazard class, UN number, IMDG classification, restrictions"
        standards:
          - "IMDG Code"
          - "IMO Compendium"

      - id: customs
        name: "Customs, Border & Regulatory Declarations"
        folder: "model/ontologies/customs/"
        owns: "Customs declarations, goods items, packaging, customs procedures, border filings, regulatory declarations, declarants, brokers, consignees/consignors, customs documents (SAD, carnets), customs offices, border crossings, bonded warehouses, free zones, and regulatory status."
        does_not_own: "Transport execution, cargo operations, commercial contracts, or DG acceptance rules."
        overlaps:
          - class: TariffClassification
            candidates: [BSP/Compliance, WCO/Customs]
            resolved_to: WCO/Customs
            rationale: "WCO is authoritative for HS codes and tariff classification."
        imports:
          - uri: "https://www.kairosflow.ai/ont/wco/customs#"
            module: "WCO / Customs"
            provides: "Customs declaration, goods item, packaging, customs procedure, duty calculation, customs value, inspection"
          - uri: "https://www.kairosflow.ai/ont/wco/trade-facilitation#"
            module: "WCO / Trade Facilitation"
            provides: "AEO, single window, advance ruling, mutual recognition"
          - uri: "https://www.kairosflow.ai/ont/wco/party#"
            module: "WCO / Party"
            provides: "Declarant, broker, importer, exporter, consignee, consignor, AEO holder, guarantee provider"
          - uri: "https://www.kairosflow.ai/ont/wco/documents#"
            module: "WCO / Documents"
            provides: "SAD, T1/T2 transit, ATA/TIR carnets, certificate of origin"
          - uri: "https://www.kairosflow.ai/ont/wco/locations#"
            module: "WCO / Locations"
            provides: "Customs office, border crossing, bonded warehouse, free zone"
        standards:
          - "WCO Data Model 3.10.0"
          - "UN/CEFACT Cross-Border Management"

      - id: compliance
        name: "Compliance, Governance, Policy & Legal"
        folder: "model/ontologies/compliance/"
        owns: "Regulatory policies, corporate governance, privacy, audit evidence, and legal document metadata."
        does_not_own: "Customs filings, cargo restrictions, commercial contracts, or invoice settlement."
        imports:
          - uri: "https://www.kairosflow.ai/ont/bsp/compliance#"
            module: "BSP / Compliance"
            provides: "Compliance obligation, policy, regulatory requirement"
        standards:
          - "ISO 20197-1:2024 BSP-RDM"

      - id: sustainability
        name: "Sustainability, Carbon, Energy & ESG"
        folder: "model/ontologies/sustainability/"
        owns: "Carbon intensity, emissions factors, energy consumption, modal-shift metrics, Scope 1/2/3 reporting, and ESG indicators."
        does_not_own: "Commercial surcharge pricing, operational events, or vessel/terminal master data."
        imports:
          - uri: "https://www.kairosflow.ai/ont/sustainability/carbon#"
            module: "Sustainability / Carbon"
            provides: "Carbon emission, emission factor, CO₂ intensity, tonne-km"
          - uri: "https://www.kairosflow.ai/ont/sustainability/energy#"
            module: "Sustainability / Energy"
            provides: "Energy consumption, fuel type, modal shift metric"
        standards:
          - "ISO 14083:2023"
          - "GLEC Framework"
          - "EU MRV/ETS"

  - id: visibility-events
    name: "Visibility & Events"
    question: "What happened, where, when, to what?"
    domains:

      - id: events
        name: "Track & Trace / Operational Events"
        folder: "model/ontologies/events/"
        owns: "Normalised event model across cargo, equipment, vessel, terminal, gate, handover, and multimodal transport events."
        does_not_own: "Master definitions of cargo, vessel, equipment, terminal, route, or customer."
        overlaps:
          - class: ShipmentEvent
            candidates: [BSP/Commercial, DCSA/Events]
            resolved_to: DCSA/Events
            rationale: "DCSA event model is authoritative for shipping milestones."
          - class: InspectionEvent
            candidates: [MMT/Events, TIC/Events]
            resolved_to: TIC/Events
            rationale: "Inspections are terminal operations."
        imports:
          - uri: "https://www.kairosflow.ai/ont/dcsa/track-and-trace#"
            module: "DCSA / Track and Trace"
            provides: "Shipment event, equipment event, transport event"
          - uri: "https://www.kairosflow.ai/ont/dcsa/events#"
            module: "DCSA / Events"
            provides: "Event classification, event type codes"
          - uri: "https://www.kairosflow.ai/ont/tic/events#"
            module: "TIC / Events"
            provides: "Terminal operational events, gate events"
          - uri: "https://www.kairosflow.ai/ont/mmt/events#"
            module: "MMT / Events"
            provides: "Multimodal transport events, handover events, inland transport events"
        standards:
          - "DCSA Track & Trace"
          - "TIC 4.0"
          - "GS1 EPCIS/CBV (reference)"

      - id: claims
        name: "Claims, Damage, Exception & Incident Management"
        folder: "model/ontologies/claims/"
        owns: "Damage records, claims, operational exceptions, incidents, root-cause classification, and resolution status."
        does_not_own: "Routine operational events, cargo master data, vehicle service completion, or invoice settlement."
        imports: []
        note: "Primarily a client extension domain. No dedicated reference model — build on top of events and cargo domains."
        standards: []

      - id: documents
        name: "Documents, Messages & Evidence"
        folder: "model/ontologies/documents/"
        owns: "Business and transport documents, message metadata, document versions, evidence, and document-to-shipment links."
        does_not_own: "Semantic truth of cargo, bookings, customs, or invoices — references them via links."
        imports:
          - uri: "https://www.kairosflow.ai/ont/bsp/documents#"
            module: "BSP / Documents"
            provides: "Document types, evidence, attachments"
          - uri: "https://www.kairosflow.ai/ont/dcsa/transport-documents#"
            module: "DCSA / Transport Documents"
            provides: "Bill of lading, waybill, shipping instruction document"
          - uri: "https://www.kairosflow.ai/ont/mmt/documents#"
            module: "MMT / Documents"
            provides: "Transport document types, multimodal waybill, delivery note"
        standards:
          - "ISO 20197-1:2024 BSP-RDM"
          - "DCSA eBL"

      - id: reference-data
        name: "Master Data, Code Lists & Reference Data"
        folder: "model/ontologies/reference-data/"
        owns: "Shared identifiers, code lists, location codes, port codes, equipment type codes, status codes, UoM, and currency."
        does_not_own: "Domain-specific transactions or operational events."
        imports:
          - uri: "https://www.kairosflow.ai/ont/bsp/reference-data#"
            module: "BSP / Reference Data"
            provides: "Code list, location, country, currency, UoM, address"
          - uri: "https://www.kairosflow.ai/ont/dcsa/locations#"
            module: "DCSA / Locations"
            provides: "Facility, UN location code, address"
        note: "Cross-cutting domain consumed by all other domains."
        standards:
          - "UN/LOCODE"
          - "ISO code lists"
          - "UN/CEFACT CCL"

  - id: master-data-management
    name: "Master Data Management"
    question: "What is the single golden-record truth?"
    domains:

      - id: mdm
        name: "MDM Hub (Golden Records, Crosswalks, Match/Merge)"
        folder: "model/ontologies/mdm/"
        owns: "Golden records, crosswalks (source-to-golden links), source system registry, match groups, merge events, and survivorship rules."
        does_not_own: "Domain-specific entity definitions — it masters them via reference."
        imports: []
        note: "MDM does not import domain ontologies. Instead, domain entities reference MDM via mastersEntity. This keeps MDM decoupled and reusable across any domain."
        standards:
          - "Gartner MDM Implementation Styles"

# ────────────────────────────────────────────────────────────────────────────
# Cross-Domain Relationships
# ────────────────────────────────────────────────────────────────────────────
#
# These relationships connect classes across different ontology standards.
# Within a single standard (e.g., MMT consignment → MMT equipment), cross-module
# properties already exist. The entries below cover genuine cross-standard
# bridges defined in the Supply-Chain Integration module.
#
# Status values:
#   new-bridge    — a brand-new property in the supply-chain integration module
#   existing      — already defined in a standard module (listed for reference)

cross_domain_relationships:

  # ── Booking ↔ Transport ────────────────────────────────────────────────

  - id: booking-to-consignment
    source_domain: booking
    target_domain: consignment
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#bookedConsignment"
    domain_class_uri: "https://www.kairosflow.ai/ont/dcsa/booking#Booking"
    range_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    description: "Links a DCSA Booking to the MMT Consignment it creates."
    status: new-bridge

  - id: booking-to-commercial
    source_domain: booking
    target_domain: commercial
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#underAgreement"
    domain_class_uri: "https://www.kairosflow.ai/ont/dcsa/booking#Booking"
    range_class_uri: "https://www.kairosflow.ai/ont/bsp/commercial#SalesContract"
    description: "Links a DCSA Booking to the BSP commercial agreement that governs it."
    status: new-bridge

  # ── Transport ↔ Finance ────────────────────────────────────────────────

  - id: consignment-to-invoice
    source_domain: consignment
    target_domain: financial
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#invoicedVia"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    range_class_uri: "https://www.kairosflow.ai/ont/bsp/financial#Invoice"
    description: "Links an MMT Consignment to the BSP Invoice for settlement."
    status: new-bridge
    inverse_of: "https://www.kairosflow.ai/ont/supply-chain#chargesForConsignment"

  - id: invoice-to-consignment
    source_domain: financial
    target_domain: consignment
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#chargesForConsignment"
    domain_class_uri: "https://www.kairosflow.ai/ont/bsp/financial#Invoice"
    range_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    description: "Links a BSP Invoice to the MMT Consignment it charges for."
    status: new-bridge
    inverse_of: "https://www.kairosflow.ai/ont/supply-chain#invoicedVia"

  # ── Transport ↔ Schedule ───────────────────────────────────────────────

  - id: consignment-to-schedule
    source_domain: consignment
    target_domain: route-schedule
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#scheduledVia"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportService"
    range_class_uri: "https://www.kairosflow.ai/ont/dcsa/schedule#ServiceLoop"
    description: "Links an MMT TransportService to a DCSA ServiceLoop."
    status: new-bridge

  # ── Equipment ↔ Terminal ───────────────────────────────────────────────

  - id: equipment-to-terminal
    source_domain: equipment
    target_domain: terminal-operations
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#handledAtTerminal"
    domain_class_uri: "https://www.kairosflow.ai/ont/dcsa/equipment#Container"
    range_class_uri: "https://www.kairosflow.ai/ont/tic/handling-operations#CargoVisit"
    description: "Links a DCSA Container to a TIC terminal handling visit."
    status: new-bridge

  # ── Vessel ↔ Terminal ──────────────────────────────────────────────────

  - id: portcall-to-terminal
    source_domain: vessel-maritime
    target_domain: terminal-operations
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#callsAtTerminal"
    domain_class_uri: "https://www.kairosflow.ai/ont/imo/port-call#PortCall"
    range_class_uri: "https://www.kairosflow.ai/ont/tic/terminal-infrastructure#Terminal"
    description: "Links an IMO PortCall to the TIC Terminal where it occurs."
    status: new-bridge

  - id: berthstay-to-berth
    source_domain: vessel-maritime
    target_domain: terminal-operations
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#berthsAt"
    domain_class_uri: "https://www.kairosflow.ai/ont/imo/port-call#BerthStay"
    range_class_uri: "https://www.kairosflow.ai/ont/tic/terminal-infrastructure#Berth"
    description: "Links an IMO BerthStay to the TIC Berth where the vessel is moored."
    status: new-bridge

  # ── Cargo ↔ Dangerous Goods ────────────────────────────────────────────

  - id: cargo-to-dangerous-goods
    source_domain: cargo
    target_domain: dangerous-goods
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#classifiedAsDangerousGoods"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/cargo#CargoItem"
    range_class_uri: "https://www.kairosflow.ai/ont/imo/dangerous-goods#DangerousGoodsItem"
    description: "Links an MMT CargoItem to its IMO dangerous goods classification."
    status: new-bridge

  # ── Consignment ↔ Customs ──────────────────────────────────────────────

  - id: consignment-to-customs
    source_domain: consignment
    target_domain: customs
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#requiresCustomsDeclaration"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    range_class_uri: "https://www.kairosflow.ai/ont/wco/customs#CustomsDeclaration"
    description: "Links an MMT Consignment to a WCO CustomsDeclaration."
    status: new-bridge

  # ── Events ↔ Transport Entities ────────────────────────────────────────

  - id: event-to-consignment
    source_domain: events
    target_domain: consignment
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#eventRelatesToConsignment"
    domain_class_uri: "https://www.kairosflow.ai/ont/dcsa/events#Event"
    range_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    description: "Links a DCSA Event to the MMT Consignment it relates to."
    status: new-bridge

  - id: event-to-vessel
    source_domain: events
    target_domain: vessel-maritime
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#eventRelatesToVessel"
    domain_class_uri: "https://www.kairosflow.ai/ont/dcsa/events#Event"
    range_class_uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#Vessel"
    description: "Links a DCSA Event to the IMO Vessel it relates to."
    status: new-bridge

  - id: terminal-event-to-equipment
    source_domain: events
    target_domain: equipment
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#eventRelatesToEquipment"
    domain_class_uri: "https://www.kairosflow.ai/ont/tic/events#TerminalEvent"
    range_class_uri: "https://www.kairosflow.ai/ont/dcsa/equipment#Container"
    description: "Links a TIC TerminalEvent to the DCSA Container it involves."
    status: new-bridge

  # ── Existing within-standard relationships (for reference) ─────────────

  - id: consignment-to-equipment-existing
    source_domain: consignment
    target_domain: equipment
    property_uri: "https://www.kairosflow.ai/ont/mmt/consignment#hasTransportEquipment"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    range_class_uri: "https://www.kairosflow.ai/ont/mmt/equipment#TransportEquipment"
    description: "Already defined in MMT: links Consignment to TransportEquipment."
    status: existing

  - id: consignment-to-documents-existing
    source_domain: consignment
    target_domain: documents
    property_uri: "https://www.kairosflow.ai/ont/mmt/consignment#hasTransportDocument"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    range_class_uri: "https://www.kairosflow.ai/ont/mmt/documents#TransportDocument"
    description: "Already defined in MMT: links Consignment to TransportDocument."
    status: existing

  - id: consignment-to-events-existing
    source_domain: consignment
    target_domain: events
    property_uri: "https://www.kairosflow.ai/ont/mmt/consignment#hasEvent"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    range_class_uri: "https://www.kairosflow.ai/ont/mmt/events#TransportEvent"
    description: "Already defined in MMT: links Consignment to TransportEvent."
    status: existing

  - id: vessel-to-sustainability
    source_domain: vessel-maritime
    target_domain: sustainability
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#hasCIIRating"
    domain_class_uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#Vessel"
    range_class_uri: "https://www.kairosflow.ai/ont/sustainability/carbon#CIIRating"
    description: "Links a Vessel to its CII Rating — defined in Supply Chain integration module."
    status: new-bridge

  - id: vessel-to-emission-report
    source_domain: vessel-maritime
    target_domain: sustainability
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#hasEmissionReport"
    domain_class_uri: "https://www.kairosflow.ai/ont/imo/vessel-registry#Vessel"
    range_class_uri: "https://www.kairosflow.ai/ont/sustainability/carbon#EmissionReport"
    description: "Links a Vessel to its Emission Report."
    status: new-bridge

  - id: transport-to-energy
    source_domain: consignment
    target_domain: sustainability
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#hasEnergyConsumption"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportService"
    range_class_uri: "https://www.kairosflow.ai/ont/sustainability/energy#EnergyConsumption"
    description: "Links a TransportService to its Energy Consumption record."
    status: new-bridge

  - id: consignment-to-carbon
    source_domain: consignment
    target_domain: sustainability
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#hasCarbonFootprint"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#Consignment"
    range_class_uri: "https://www.kairosflow.ai/ont/sustainability/carbon#CarbonFootprint"
    description: "Links an MMT Consignment to its Carbon Footprint calculation."
    status: new-bridge

  - id: movement-to-carbon
    source_domain: consignment
    target_domain: sustainability
    property_uri: "https://www.kairosflow.ai/ont/supply-chain#hasMovementEmission"
    domain_class_uri: "https://www.kairosflow.ai/ont/mmt/consignment#TransportMovement"
    range_class_uri: "https://www.kairosflow.ai/ont/sustainability/carbon#CarbonFootprint"
    description: "Links an MMT TransportMovement to the Carbon Footprint of that specific movement leg — operational emissions data commonly lands at movement/trip grain, not consignment grain."
    status: new-bridge

  # ── Cargo ↔ Customs Goods ──────────────────────────────────────────────

  - id: cargo-to-goods-item
