package:
  id: logistics
  name: "Kairos Logistics Accelerator Pack"
  version: "1.5.0"
  description: "Pre-composed ontology bundle for logistics companies"
  namespace: "https://www.kairosflow.ai/ont/accelerator/logistics#"
  
  target_sectors:
    - Freight forwarding
    - Ocean carrier (vessel)
    - Road carrier (trucking)
    - Terminal operations
    - 3PL / logistics service provider
    - NVOCC
    - Customs brokerage

  includes:
    - id: DCSA
      name: "Digital Container Shipping Association"
      uri: "https://www.kairosflow.ai/ont/dcsa#"
      focus: "Container shipping lifecycle"
    - id: MMT
      name: "Multi-Modal Transport"
      uri: "https://www.kairosflow.ai/ont/mmt#"
      focus: "Consignment, movement, cargo, equipment"
    - id: BSP
      name: "Buy-Ship-Pay"
      uri: "https://www.kairosflow.ai/ont/bsp#"
      focus: "Party, contract, invoice, settlement"
    - id: TIC
      name: "Terminal Industry Committee 4.0"
      uri: "https://www.kairosflow.ai/ont/tic#"
      focus: "Terminal operations, handling, automotive"
    - id: IMO
      name: "International Maritime Organization"
      uri: "https://www.kairosflow.ai/ont/imo#"
      focus: "Vessel registry, dangerous goods, port-call, crew, environmental, maritime security"
    - id: WCO
      name: "World Customs Organization"
      uri: "https://www.kairosflow.ai/ont/wco#"
      focus: "Customs declarations, goods items, procedures, trade facilitation"
    - id: Sustainability
      name: "Sustainability & Carbon"
      uri: "https://www.kairosflow.ai/ont/sustainability#"
      focus: "Emissions, energy, ESG reporting"
    - id: supply-chain
      name: "Supply Chain"
      uri: "https://www.kairosflow.ai/ont/supply-chain#"
      focus: "Cross-standard bridge properties linking DCSA, MMT, BSP, TIC, IMO, and WCO"

  excludes:
    - id: FIBO
      reason: "Use Financial Services Accelerator for financial ontologies"

  standards_alignment:
    - "DCSA API Standards"
    - "UN/CEFACT MMT-RDM"
    - "ISO 20197-1:2024 Buy-Ship-Pay"
    - "TIC 4.0"
    - "IMO Compendium / FAL / IMDG"
    - "WCO Data Model 3.10.0"
    - "ISO 14083:2023"
    - "GLEC Framework"
